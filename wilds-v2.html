<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Burntwoods Wilds — New Build V2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#122b23;color:#fff;font-family:system-ui;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;pointer-events:none;font-size:14px;font-weight:800;text-shadow:0 2px 4px #000}#health{height:13px;background:#382523;border:1px solid #e9ccab;border-radius:9px;overflow:hidden;margin-top:6px}#hpfill{height:100%;width:100%;background:#ef7775}#stick{position:fixed;bottom:calc(35px + env(safe-area-inset-bottom));left:24px;width:128px;height:128px;border-radius:50%;border:3px solid #d8f3de8c;background:#183f3980;touch-action:none;display:none}#nub{position:absolute;width:48px;height:48px;border-radius:50%;background:#d8e9d9;left:37px;top:37px}#overlay{position:fixed;inset:0;background:#091e19dd;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}#panel{max-width:420px;width:100%;padding:25px;border:2px solid #f1ce83;border-radius:20px;background:#24493c;text-align:center}h1{font-size:30px;color:#ffe2a0;margin:8px 0}p{line-height:1.5}button{background:#e7bc6a;color:#16281d;border:0;border-radius:13px;padding:15px 30px;font-size:20px;font-weight:900;touch-action:manipulation}#error{position:fixed;top:0;left:0;right:0;z-index:20;background:#9c2929;padding:12px;color:white;display:none;font-size:13px}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="stats">MIMI • WAVE 1/10 • 0 KILLS</div><div id="xpbar" style="height:7px;background:#112820;border:1px solid #b8e8f0;border-radius:7px;overflow:hidden;margin-top:5px"><div id="xpfill" style="height:100%;width:0%;background:#70d7f7"></div></div><div id="build" style="margin-top:5px;font-size:11px">SWORD LV1 • POWER LV1 • DASH</div><div id="health"><div id="hpfill"></div></div></div><div id="stick"><div id="nub"></div></div><button id="power" style="display:none;position:fixed;right:17px;bottom:calc(88px + env(safe-area-inset-bottom));width:91px;height:91px;padding:3px;border-radius:50%;background:#b94e38;border:3px solid #ffe2a4;color:#fff;font-size:13px;z-index:2">⚔️<div>POWER</div><small id="powercd">READY</small></button><button id="dash" style="display:none;position:fixed;right:112px;bottom:calc(110px + env(safe-area-inset-bottom));width:70px;height:70px;padding:3px;border-radius:50%;background:#6555ad;border:3px solid #d5bfff;color:#fff;font-size:12px;z-index:2">✦<div>DASH</div><small id="dashcd">READY</small></button><div id="overlay"><div id="panel"><h1>🐈‍⬛ BURNTWOODS WILDS</h1><p><b>NEW BUILD V2</b></p><p>10 waves at Burntwood Rugby Club. Mimi auto-swings her short sword. Collect XP, choose upgrades, unleash Power Slash and Shadow Dash. Defeat Bruce the Deer!</p><button id="start">PLAY AS MIMI</button></div></div><div id="error"></div><script>
window.addEventListener('error',e=>{const d=document.getElementById('error');d.style.display='block';d.textContent='ERROR: '+e.message});
(()=>{

const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,mode='menu',player,enemies=[],effects=[],kills=0,elapsed=0,spawn=0,attack=0,last=0,clock=0;const joy={x:0,y:0,down:false,id:null};const keys={};const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function mimi(){const p=player,bob=Math.sin(clock*9)*1.6,step=Math.sin(clock*13);ctx.save();ctx.translate(p.x,p.y+bob);ctx.rotate(p.face+Math.PI/2);oval(0,17,17,6,'#08251c88');ctx.strokeStyle='#26232c';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(11,9);ctx.bezierCurveTo(26,18,30,-3,20,-10+Math.sin(clock*4)*3);ctx.stroke();for(let side of [-1,1]){oval(side*9,13+side*step*3,6,9,'#292631');oval(side*9,19+side*step*3,5,3,'#49404d')}oval(0,6,13,17,'#292631');oval(0,9,7,11,'#48404c');for(let side of [-1,1]){ctx.fillStyle='#292631';ctx.beginPath();ctx.moveTo(side*5,-11);ctx.lineTo(side*13,-28);ctx.lineTo(side*17,-8);ctx.fill();ctx.fillStyle='#eda2c5';ctx.beginPath();ctx.moveTo(side*9,-14);ctx.lineTo(side*13,-23);ctx.lineTo(side*14,-11);ctx.fill()}oval(0,-9,21,19,'#292631');oval(-14,-2,4,2.5,'#bc748e');oval(14,-2,4,2.5,'#bc748e');const blink=clock%4.7>4.56;for(let side of [-1,1]){if(blink){ctx.strokeStyle='#eee0bc';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(side*3,-12);ctx.lineTo(side*12,-12);ctx.stroke()}else{oval(side*7,-12,5.2,6.2,'#f6e9c6');oval(side*7,-12,2.7,4.5,'#79bc90');circle(side*7,-12,1.5,'#1b2c29');circle(side*7-1,-14,1.1,'#fff')}}oval(0,-3,6,4,'#4d4551');oval(0,-4,3,2,'#e8a2b3');ctx.strokeStyle='#eee3d9';ctx.lineWidth=1;for(let side of [-1,1])for(let n of [-1,0,1]){ctx.beginPath();ctx.moveTo(side*3,-1);ctx.lineTo(side*18,-2+n*4);ctx.stroke()}ctx.strokeStyle='#e99cbd';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,8,10,.15,Math.PI-.15);ctx.stroke();circle(0,18,2.8,'#f8d36e');ctx.restore()}
function enemy(e){oval(e.x,e.y+13,15,5,'#09271a88');circle(e.x,e.y,15,'#794b3d');for(let side of [-1,1]){ctx.fillStyle='#794b3d';ctx.beginPath();ctx.moveTo(e.x+side*8,e.y-10);ctx.lineTo(e.x+side*12,e.y-22);ctx.lineTo(e.x+side*16,e.y-8);ctx.fill();circle(e.x+side*6,e.y-2,3,'#ff8277')}oval(e.x,e.y+7,5,3,'#c99c8a')}

let xp=0,xpNeed=18,level=1,wave=1,waveTime=0,upgrades=0,slashLevel=1,powerLevel=1,speedLevel=0,maxHpLevel=0,regenLevel=0,critLevel=0,rangeLevel=0,extraSword=0,rerolls=1,powerCd=0,dashCd=0,bossSpawned=false,boss=null,invincible=0,bonus=0;
const WAVE_SECS=17;
function reset(){player={x:W/2,y:H/2,hp:100,maxHp:100,face:0,inv:0};enemies=[];effects=[];kills=0;elapsed=0;spawn=.5;attack=0;clock=0;xp=0;xpNeed=18;level=1;wave=1;waveTime=0;upgrades=0;slashLevel=1;powerLevel=1;speedLevel=0;maxHpLevel=0;regenLevel=0;critLevel=0;rangeLevel=0;extraSword=0;rerolls=1;powerCd=0;dashCd=0;bossSpawned=false;boss=null;bonus=0;mode='play';$('overlay').style.display='none';$('stick').style.display='block';$('power').style.display='block';$('dash').style.display='block';$('error').style.display='none';hud()}
$('start').addEventListener('click',reset);
function end(win){mode='end';$('stick').style.display='none';$('power').style.display='none';$('dash').style.display='none';$('overlay').style.display='flex';$('panel').innerHTML='<h1>'+(win?'🏆 MIMI DEFEATED BRUCE!':'💔 MIMI WAS CAUGHT')+'</h1><p>Wave '+wave+' • Level '+level+' • '+kills+' enemies defeated</p><button id="again">PLAY AGAIN</button>';$('again').addEventListener('click',reset)}
function hud(){$('stats').textContent='MIMI • WAVE '+wave+'/10 • LV '+level+' • '+kills+' KILLS • '+Math.ceil(Math.max(0,WAVE_SECS-waveTime))+'s';$('hpfill').style.width=Math.max(0,100*player.hp/player.maxHp)+'%';$('xpfill').style.width=Math.min(100,100*xp/xpNeed)+'%';$('build').textContent='SWORD LV'+slashLevel+' • RANGE '+(rangeLevel+1)+' • POWER LV'+powerLevel+' • XP '+Math.floor(xp)+'/'+xpNeed;$('powercd').textContent=powerCd>0?powerCd.toFixed(1)+'s':'READY';$('dashcd').textContent=dashCd>0?dashCd.toFixed(1)+'s':'READY'}
function gainXp(v){xp+=v;if(xp>=xpNeed){xp-=xpNeed;level++;xpNeed=Math.round(18+level*8+level*level*.65);upgrades++;showUpgrade()}}
const upgradeDefs=[
 ['⚔️ Sharper Sword','Sword damage +30%',()=>slashLevel++],
 ['🌙 Wider Slash','Sword range and arc increase',()=>rangeLevel++],
 ['💨 Swift Paws','Movement speed +15%',()=>speedLevel++],
 ['❤️ Bigger Heart','Maximum health +25 and heal',()=>{player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+35);maxHpLevel++}],
 ['✨ Power Slash','Power attack damage +40%',()=>powerLevel++],
 ['🍀 Lucky Claws','Critical hit chance +8%',()=>critLevel++],
 ['🌿 Healing Purr','Slow health regeneration',()=>regenLevel++],
 ['🗡️ Double Strike','Chance for an extra slash',()=>extraSword++]
];
function showUpgrade(){if(mode==='end')return;mode='upgrade';$('overlay').style.display='flex';$('panel').innerHTML='<h1>⭐ LEVEL '+level+'</h1><p>Choose one upgrade for Mimi</p><div id="options"></div><p id="rerolltext">Rerolls left: '+rerolls+'</p><button id="reroll" style="font-size:14px;padding:10px">↻ REROLL</button>';renderOptions();$('reroll').onclick=()=>{if(rerolls<=0)return;rerolls--;$('rerolltext').textContent='Rerolls left: '+rerolls;renderOptions();$('reroll').disabled=true}}
function renderOptions(){const arr=[...upgradeDefs].sort(()=>Math.random()-.5).slice(0,3);const holder=$('options');holder.innerHTML='';arr.forEach(([name,desc,apply])=>{const b=document.createElement('button');b.style.cssText='display:block;width:100%;margin:8px 0;text-align:left;font-size:15px;padding:12px;background:#d3e6b4';b.innerHTML=name+'<div style="font-size:12px;font-weight:500">'+desc+'</div>';b.onclick=()=>{apply();upgrades--;if(upgrades>0)showUpgrade();else{mode='play';$('overlay').style.display='none'}hud()};holder.appendChild(b)})}
function spawnEnemy(){const edge=Math.floor(rand(0,4)),isBrute=Math.random()<Math.min(.35,wave*.03);enemies.push({x:edge===0?-25:edge===1?W+25:rand(0,W),y:edge===2?-25:edge===3?H+25:rand(0,H),hp:(isBrute?90:38)*(1+(wave-1)*.17),speed:(isBrute?31:rand(37,55))+wave*2,r:isBrute?21:15,brute:isBrute,boss:false,hit:0})}
function spawnBruce(){bossSpawned=true;boss={x:W/2,y:-90,hp:1500,maxHp:1500,speed:39,r:49,boss:true,hit:0,charge:0};enemies.push(boss)}
function hitEnemy(e,dmg,dx,dy){if(e.hit>0)return;const critical=Math.random()<critLevel*.08;const total=dmg*(critical?1.8:1);e.hp-=total;e.hit=.09;e.x+=dx*(e.boss?3:15);e.y+=dy*(e.boss?3:15);effects.push({x:e.x,y:e.y,t:.18,hit:true,critical});if(e.hp<=0){const ix=enemies.indexOf(e);if(ix>=0)enemies.splice(ix,1);kills++;if(e.boss){boss=null;end(true)}else gainXp(e.brute?7:4)}}
function sword(mult=1,wide=false){const reach=(wide?115:75)+rangeLevel*12;let target=null,best=reach;for(const e of enemies){const d=dist(e,player);if(d<best){best=d;target=e}}if(!target)return false;const face=Math.atan2(target.y-player.y,target.x-player.x);player.face=face;effects.push({x:player.x,y:player.y,a:face,t:.23,power:wide});const arc=wide?2.6:1.85;for(const e of [...enemies]){const d=dist(e,player);if(d>reach+e.r)continue;const ang=Math.atan2(e.y-player.y,e.x-player.x),delta=Math.atan2(Math.sin(ang-face),Math.cos(ang-face));if(Math.abs(delta)<=arc/2)hitEnemy(e,(27+slashLevel*11)*mult*(wide?1+powerLevel*.45:1),Math.cos(ang),Math.sin(ang));if(mode!=='play')break}return true}
function powerAttack(){if(mode!=='play'||powerCd>0)return;powerCd=4;sword(2.2,true);hud()}
function shadowDash(){if(mode!=='play'||dashCd>0)return;dashCd=9;let dx=joy.x,dy=joy.y;const len=Math.hypot(dx,dy);if(len<.15){dx=Math.cos(player.face);dy=Math.sin(player.face)}else{dx/=len;dy/=len}for(let i=0;i<8;i++)effects.push({x:player.x+dx*i*16,y:player.y+dy*i*16,t:.35,trail:true});player.x=Math.max(24,Math.min(W-24,player.x+dx*130));player.y=Math.max(40,Math.min(H-24,player.y+dy*130));player.inv=.5;hud()}
$('power').addEventListener('pointerdown',e=>{e.preventDefault();powerAttack()});$('dash').addEventListener('pointerdown',e=>{e.preventDefault();shadowDash()});
function update(dt){if(mode!=='play')return;clock+=dt;elapsed+=dt;waveTime+=dt;powerCd=Math.max(0,powerCd-dt);dashCd=Math.max(0,dashCd-dt);if(regenLevel)player.hp=Math.min(player.maxHp,player.hp+regenLevel*.75*dt);if(waveTime>=WAVE_SECS&&wave<10){wave++;waveTime=0;bonus=2;player.hp=Math.min(player.maxHp,player.hp+12)}if(wave===10&&!bossSpawned&&waveTime>4)spawnBruce();
let dx=joy.x,dy=joy.y;if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}player.x=Math.max(24,Math.min(W-24,player.x+dx*(195+speedLevel*29)*dt));player.y=Math.max(40,Math.min(H-24,player.y+dy*(195+speedLevel*29)*dt));if(len>.12)player.face=Math.atan2(dy,dx);player.inv=Math.max(0,player.inv-dt);
spawn-=dt;if(spawn<=0){if(enemies.length<90)for(let i=0;i<Math.min(3,1+Math.floor(wave/4));i++)spawnEnemy();spawn=Math.max(.34,1.2-wave*.075)}
for(const e of [...enemies]){e.hit=Math.max(0,e.hit-dt);const d=Math.max(1,dist(e,player));e.x+=(player.x-e.x)/d*e.speed*dt;e.y+=(player.y-e.y)/d*e.speed*dt;if(d<e.r+12&&player.inv<=0){player.hp-=e.boss?24:e.brute?17:10;player.inv=.72;if(player.hp<=0){end(false);return}}}
attack-=dt;if(attack<=0){if(sword()){attack=Math.max(.22,.63-slashLevel*.025);if(extraSword&&Math.random()<Math.min(.65,extraSword*.2))sword(.65)}}
for(let i=effects.length-1;i>=0;i--){effects[i].t-=dt;if(effects[i].t<=0)effects.splice(i,1)}if(bonus>0)bonus=Math.max(0,bonus-dt);hud()}
function draw(){ctx.fillStyle='#317849';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff0b';for(let x=0;x<W;x+=60)ctx.fillRect(x,0,30,H);ctx.strokeStyle='#f0f5d0bb';ctx.lineWidth=3;ctx.strokeRect(17,40,W-34,H-80);for(let y=90;y<H-40;y+=95){ctx.beginPath();ctx.moveTo(17,y);ctx.lineTo(W-17,y);ctx.stroke()}ctx.strokeStyle='#f0f5d088';ctx.beginPath();ctx.moveTo(W/2,40);ctx.lineTo(W/2,H-40);ctx.stroke();if(!player)return;
for(const e of enemies){if(e.boss){oval(e.x,e.y+27,55,16,'#0b2b2388');oval(e.x,e.y+8,46,38,'#956342');oval(e.x,e.y-22,29,28,'#c1905b');oval(e.x-13,e.y-27,5,5,'#261d1a');oval(e.x+13,e.y-27,5,5,'#261d1a');ctx.strokeStyle='#f3d0a1';ctx.lineWidth=7;for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(e.x+side*15,e.y-42);ctx.lineTo(e.x+side*43,e.y-82);ctx.lineTo(e.x+side*57,e.y-96);ctx.moveTo(e.x+side*43,e.y-82);ctx.lineTo(e.x+side*34,e.y-107);ctx.stroke()}ctx.strokeStyle='#f17d31';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(e.x-54,e.y-93);ctx.lineTo(e.x+53,e.y-86);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText('BRUCE THE DEER',e.x,e.y+65);ctx.fillStyle='#4b2424';ctx.fillRect(e.x-55,e.y+70,110,8);ctx.fillStyle='#f4ad66';ctx.fillRect(e.x-55,e.y+70,110*Math.max(0,e.hp/e.maxHp),8)}else{enemy(e);if(e.brute){ctx.fillStyle='#d7b58a';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('BRUTE',e.x,e.y+28)}}}
if(!(player.inv>0&&Math.floor(clock*14)%2===0))mimi();
for(const f of effects){ctx.save();ctx.globalAlpha=Math.min(1,f.t*5);if(f.trail){circle(f.x,f.y,14,'#bd9bf5')}else if(f.hit){circle(f.x,f.y,f.critical?17:10,f.critical?'#ffdf76':'#f8b9a2')}else{ctx.translate(f.x,f.y);ctx.rotate(f.a);ctx.strokeStyle=f.power?'#ffcf73':'#ffefb0';ctx.lineWidth=f.power?15:9;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,f.power?105:67,-1.15,1.15);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,f.power?112:75,-1,1);ctx.stroke()}ctx.restore()}
if(bonus>0){ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff1b8';ctx.fillText('WAVE '+wave+'!',W/2,H*.29)}}
function frame(t){const dt=Math.min(.04,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
const stick=$('stick'),nub=$('nub');function move(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y)||1,k=Math.min(1,l/48);joy.x=x/l*k;joy.y=y/l*k;nub.style.transform='translate('+joy.x*36+'px,'+joy.y*36+'px)'}function release(e){if(e&&joy.id!==e.pointerId)return;joy.down=false;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerdown',e=>{e.preventDefault();joy.down=true;joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',e=>{if(joy.down&&joy.id===e.pointerId)move(e)});stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
})();
