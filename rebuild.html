<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Burntwoods Wilds — Rebuild V1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#122b23;color:#fff;font-family:system-ui;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;pointer-events:none;font-size:14px;font-weight:800;text-shadow:0 2px 4px #000}#health{height:13px;background:#382523;border:1px solid #e9ccab;border-radius:9px;overflow:hidden;margin-top:6px}#hpfill{height:100%;width:100%;background:#ef7775}#stick{position:fixed;bottom:calc(35px + env(safe-area-inset-bottom));left:24px;width:128px;height:128px;border-radius:50%;border:3px solid #d8f3de8c;background:#183f3980;touch-action:none;display:none}#nub{position:absolute;width:48px;height:48px;border-radius:50%;background:#d8e9d9;left:37px;top:37px}#overlay{position:fixed;inset:0;background:#091e19dd;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}#panel{max-width:420px;width:100%;padding:25px;border:2px solid #f1ce83;border-radius:20px;background:#24493c;text-align:center}h1{font-size:30px;color:#ffe2a0;margin:8px 0}p{line-height:1.5}button{background:#e7bc6a;color:#16281d;border:0;border-radius:13px;padding:15px 30px;font-size:20px;font-weight:900;touch-action:manipulation}#error{position:fixed;top:0;left:0;right:0;z-index:20;background:#9c2929;padding:12px;color:white;display:none;font-size:13px}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="stats">MIMI • 0 KILLS • 60s</div><div id="health"><div id="hpfill"></div></div></div><div id="stick"><div id="nub"></div></div><div id="overlay"><div id="panel"><h1>🐈‍⬛ BURNTWOODS WILDS</h1><p><b>REBUILD V1</b></p><p>Guide petite Mimi around the rugby pitch. Her short sword automatically strikes nearby enemies. Survive 60 seconds!</p><button id="start">PLAY AS MIMI</button></div></div><div id="error"></div><script>
window.addEventListener('error',e=>{const d=document.getElementById('error');d.style.display='block';d.textContent='ERROR: '+e.message});
(()=>{
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,mode='menu',player,enemies=[],effects=[],kills=0,elapsed=0,spawn=0,attack=0,last=0,clock=0;const joy={x:0,y:0,down:false,id:null};const keys={};const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function oval(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function mimi(){const p=player,bob=Math.sin(clock*9)*1.6,step=Math.sin(clock*13);ctx.save();ctx.translate(p.x,p.y+bob);ctx.rotate(p.face+Math.PI/2);oval(0,17,17,6,'#08251c88');ctx.strokeStyle='#26232c';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(11,9);ctx.bezierCurveTo(26,18,30,-3,20,-10+Math.sin(clock*4)*3);ctx.stroke();for(let side of [-1,1]){oval(side*9,13+side*step*3,6,9,'#292631');oval(side*9,19+side*step*3,5,3,'#49404d')}oval(0,6,13,17,'#292631');oval(0,9,7,11,'#48404c');for(let side of [-1,1]){ctx.fillStyle='#292631';ctx.beginPath();ctx.moveTo(side*5,-11);ctx.lineTo(side*13,-28);ctx.lineTo(side*17,-8);ctx.fill();ctx.fillStyle='#eda2c5';ctx.beginPath();ctx.moveTo(side*9,-14);ctx.lineTo(side*13,-23);ctx.lineTo(side*14,-11);ctx.fill()}oval(0,-9,18,16,'#292631');const blink=clock%4.7>4.56;for(let side of [-1,1]){if(blink){ctx.strokeStyle='#eee0bc';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(side*3,-12);ctx.lineTo(side*12,-12);ctx.stroke()}else{oval(side*7,-12,5.2,6.2,'#f6e9c6');oval(side*7,-12,2.7,4.5,'#79bc90');circle(side*7,-12,1.5,'#1b2c29');circle(side*7-1,-14,1.1,'#fff')}}oval(0,-3,6,4,'#4d4551');oval(0,-4,3,2,'#e8a2b3');ctx.strokeStyle='#eee3d9';ctx.lineWidth=1;for(let side of [-1,1])for(let n of [-1,0,1]){ctx.beginPath();ctx.moveTo(side*3,-1);ctx.lineTo(side*18,-2+n*4);ctx.stroke()}ctx.strokeStyle='#e99cbd';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,8,10,.15,Math.PI-.15);ctx.stroke();circle(0,18,2.8,'#f8d36e');ctx.restore()}
function enemy(e){oval(e.x,e.y+13,15,5,'#09271a88');circle(e.x,e.y,15,'#794b3d');for(let side of [-1,1]){ctx.fillStyle='#794b3d';ctx.beginPath();ctx.moveTo(e.x+side*8,e.y-10);ctx.lineTo(e.x+side*12,e.y-22);ctx.lineTo(e.x+side*16,e.y-8);ctx.fill();circle(e.x+side*6,e.y-2,3,'#ff8277')}oval(e.x,e.y+7,5,3,'#c99c8a')}
function reset(){player={x:W/2,y:H/2,hp:100,face:0,inv:0};enemies=[];effects=[];kills=0;elapsed=0;spawn=0;attack=0;clock=0;mode='play';$('overlay').style.display='none';$('stick').style.display='block'}
$('start').addEventListener('click',reset);
function end(win){mode='end';$('stick').style.display='none';$('overlay').style.display='flex';$('panel').innerHTML='<h1>'+(win?'🏆 MIMI SURVIVED!':'💔 MIMI WAS CAUGHT')+'</h1><p>'+kills+' enemies defeated</p><button id="again">PLAY AGAIN</button>';$('again').addEventListener('click',reset)}
function update(dt){if(mode!=='play')return;clock+=dt;elapsed+=dt;if(elapsed>=60){end(true);return}let dx=joy.x,dy=joy.y;if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}player.x=Math.max(24,Math.min(W-24,player.x+dx*195*dt));player.y=Math.max(40,Math.min(H-24,player.y+dy*195*dt));if(len>.12)player.face=Math.atan2(dy,dx);player.inv=Math.max(0,player.inv-dt);spawn-=dt;if(spawn<=0){const edge=Math.floor(rand(0,4));enemies.push({x:edge===0?-20:edge===1?W+20:rand(0,W),y:edge===2?-20:edge===3?H+20:rand(0,H),hp:36,speed:rand(35,53)+elapsed*.25});spawn=Math.max(.45,1.5-elapsed*.013)}for(const e of enemies){const d=Math.max(1,dist(e,player));e.x+=(player.x-e.x)/d*e.speed*dt;e.y+=(player.y-e.y)/d*e.speed*dt;if(d<25&&player.inv<=0){player.hp-=14;player.inv=.7;if(player.hp<=0){end(false);return}}}attack-=dt;if(attack<=0){let target=null,best=82;for(const e of enemies){const d=dist(e,player);if(d<best){best=d;target=e}}if(target){player.face=Math.atan2(target.y-player.y,target.x-player.x);attack=.55;effects.push({x:player.x,y:player.y,a:player.face,t:.22});for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],d=dist(e,player),delta=Math.atan2(Math.sin(Math.atan2(e.y-player.y,e.x-player.x)-player.face),Math.cos(Math.atan2(e.y-player.y,e.x-player.x)-player.face));if(d<83&&Math.abs(delta)<1.1){e.hp-=36;e.x+=Math.cos(player.face)*15;e.y+=Math.sin(player.face)*15;if(e.hp<=0){enemies.splice(i,1);kills++}}}}}for(let i=effects.length-1;i>=0;i--){effects[i].t-=dt;if(effects[i].t<=0)effects.splice(i,1)}$('stats').textContent='MIMI • '+kills+' KILLS • '+Math.ceil(60-elapsed)+'s';$('hpfill').style.width=Math.max(0,player.hp)+'%'}
function draw(){ctx.fillStyle='#317849';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff0b';for(let x=0;x<W;x+=60)ctx.fillRect(x,0,30,H);ctx.strokeStyle='#f0f5d0bb';ctx.lineWidth=3;ctx.strokeRect(17,40,W-34,H-80);for(let y=90;y<H-40;y+=95){ctx.beginPath();ctx.moveTo(17,y);ctx.lineTo(W-17,y);ctx.stroke()}ctx.strokeStyle='#f0f5d088';ctx.beginPath();ctx.moveTo(W/2,40);ctx.lineTo(W/2,H-40);ctx.stroke();if(!player)return;for(const e of enemies)enemy(e);if(!(player.inv>0&&Math.floor(clock*14)%2===0))mimi();for(const f of effects){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);ctx.strokeStyle='#ffefb0';ctx.globalAlpha=Math.min(1,f.t*5);ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,67,-.95,.95);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,75,-.8,.8);ctx.stroke();ctx.restore()}}
function frame(t){const dt=Math.min(.04,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
const stick=$('stick'),nub=$('nub');function move(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y)||1,k=Math.min(1,l/48);joy.x=x/l*k;joy.y=y/l*k;nub.style.transform='translate('+joy.x*36+'px,'+joy.y*36+'px)'}function release(e){if(e&&joy.id!==e.pointerId)return;joy.down=false;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerdown',e=>{e.preventDefault();joy.down=true;joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',e=>{if(joy.down&&joy.id===e.pointerId)move(e)});stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
})();
</script></body></html>
