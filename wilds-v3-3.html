function hud(){$('stats').textContent=hero().name.toUpperCase()+' • WAVE '+wave+'/10 • LV '+level+' • '+kills+' KILLS • '+Math.ceil(Math.max(0,WAVE_SECS-waveTime))+'s';$('hpfill').style.width=Math.max(0,100*player.hp/player.maxHp)+'%';$('xpfill').style.width=Math.min(100,100*xp/xpNeed)+'%';$('build').textContent='SWORD LV'+slashLevel+' • RANGE '+(rangeLevel+1)+' • POWER LV'+powerLevel+' • '+hero().weapon+' • XP '+Math.floor(xp)+'/'+xpNeed;$('powercd').textContent=powerCd>0?powerCd.toFixed(1)+'s':'READY';$('dashcd').textContent=dashCd>0?dashCd.toFixed(1)+'s':'READY'}
function gainXp(v){xp+=v;if(xp>=xpNeed){xp-=xpNeed;level++;xpNeed=Math.round(32+level*13+level*level*1.3);upgrades++;showUpgrade()}}
const upgradeDefs=[
 ['⚔️ Sharper Sword','Sword damage +30%',()=>slashLevel++],
 ['🌙 Wider Slash','Sword range and arc increase',()=>rangeLevel++],
 ['💨 Swift Paws','Movement speed +15%',()=>speedLevel++],
 ['❤️ Bigger Heart','Maximum health +25 and heal',()=>{player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+35);maxHpLevel++}],
 ['✨ Power Slash','Power attack damage +40%',()=>powerLevel++],
 ['🍀 Lucky Claws','Critical hit chance +8%',()=>critLevel++],
 ['🌿 Healing Purr','Slow health regeneration',()=>regenLevel++],
 ['🗡️ Double Strike','Chance for an extra slash',()=>extraSword++]
];
function showUpgrade(){if(mode==='end')return;mode='upgrade';$('overlay').style.display='flex';$('panel').innerHTML='<h1>⭐ LEVEL '+level+'</h1><p>Choose one upgrade for Mimi</p><div id="options"></div><p id="rerolltext">Rerolls left: '+rerolls+'</p><button id="reroll" style="font-size:14px;padding:10px">↻ REROLL</button>';renderOptions();$('reroll').onclick=()=>{if(rerolls<=0)return;rerolls--;$('rerolltext').textContent='Rerolls left: '+rerolls;renderOptions();$('reroll').disabled=true}}
function renderOptions(){const arr=[...upgradeDefs].sort(()=>Math.random()-.5).slice(0,3);const holder=$('options');holder.innerHTML='';arr.forEach(([name,desc,apply])=>{const b=document.createElement('button');b.style.cssText='display:block;width:100%;margin:8px 0;text-align:left;font-size:15px;padding:12px;background:#d3e6b4';b.innerHTML=name+'<div style="font-size:12px;font-weight:500">'+desc+'</div>';b.onclick=()=>{apply();upgrades--;if(upgrades>0)showUpgrade();else{mode='play';$('overlay').style.display='none'}hud()};holder.appendChild(b)})}
function spawnEnemy(){const edge=Math.floor(rand(0,4)),isBrute=Math.random()<Math.min(.35,wave*.03),gap=rand(310,420),offset=rand(-Math.max(W,H)*.5,Math.max(W,H)*.5),ex=edge===0?player.x-gap:edge===1?player.x+gap:player.x+offset,ey=edge===2?player.y-gap:edge===3?player.y+gap:player.y+offset;enemies.push({x:Math.max(20,Math.min(worldW()-20,ex)),y:Math.max(20,Math.min(worldH()-20,ey)),hp:(isBrute?90:38)*(1+(wave-1)*.17),speed:(isBrute?27:rand(31,46))+wave*1.7,r:isBrute?21:15,brute:isBrute,boss:false,hit:0})}
function spawnBruce(){bossSpawned=true;boss={x:player.x,y:Math.max(40,player.y-350),hp:1500,maxHp:1500,speed:39,r:49,boss:true,hit:0,charge:0};enemies.push(boss)}
function hitEnemy(e,dmg,dx,dy){if(e.hit>0)return;const critical=Math.random()<critLevel*.08;const total=dmg*(critical?1.8:1);e.hp-=total;e.hit=.09;e.x+=dx*(e.boss?3:15);e.y+=dy*(e.boss?3:15);effects.push({x:e.x,y:e.y,t:.18,hit:true,critical});if(e.hp<=0){const ix=enemies.indexOf(e);if(ix>=0)enemies.splice(ix,1);kills++;if(e.boss){boss=null;end(true)}else gainXp(e.brute?5:3)}}
function sword(mult=1,wide=false){const reach=((wide?115:75)+rangeLevel*12)*hero().rng;let target=null,best=reach;for(const e of enemies){const d=dist(e,player);if(d<best){best=d;target=e}}if(!target)return false;const face=Math.atan2(target.y-player.y,target.x-player.x);player.face=face;effects.push({x:player.x,y:player.y,a:face,t:.23,power:wide});const arc=wide?2.6:1.85;for(const e of [...enemies]){const d=dist(e,player);if(d>reach+e.r)continue;const ang=Math.atan2(e.y-player.y,e.x-player.x),delta=Math.atan2(Math.sin(ang-face),Math.cos(ang-face));if(Math.abs(delta)<=arc/2)hitEnemy(e,(27+slashLevel*11)*hero().dmg*mult*(wide?1+powerLevel*.45:1),Math.cos(ang),Math.sin(ang));if(mode!=='play')break}return true}
function powerAttack(){if(mode!=='play'||powerCd>0)return;powerCd=4;sword(2.2,true);hud()}
function shadowDash(){if(mode!=='play'||dashCd>0)return;dashCd=9;let dx=joy.x,dy=joy.y;const len=Math.hypot(dx,dy);if(len<.15){dx=Math.cos(player.face);dy=Math.sin(player.face)}else{dx/=len;dy/=len}for(let i=0;i<8;i++)effects.push({x:player.x+dx*i*16,y:player.y+dy*i*16,t:.35,trail:true});player.x=Math.max(24,Math.min(worldW()-24,player.x+dx*130));player.y=Math.max(40,Math.min(worldH()-24,player.y+dy*130));player.inv=.5;hud()}
$('power').addEventListener('pointerdown',e=>{e.preventDefault();powerAttack()});$('dash').addEventListener('pointerdown',e=>{e.preventDefault();shadowDash()});
function update(dt){if(mode!=='play')return;clock+=dt;elapsed+=dt;waveTime+=dt;powerCd=Math.max(0,powerCd-dt);dashCd=Math.max(0,dashCd-dt);if(regenLevel)player.hp=Math.min(player.maxHp,player.hp+regenLevel*.75*dt);if(waveTime>=WAVE_SECS&&wave<10){wave++;waveTime=0;bonus=2;player.hp=Math.min(player.maxHp,player.hp+12)}if(wave===10&&!bossSpawned&&waveTime>4)spawnBruce();
let dx=joy.x,dy=joy.y;if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}player.x=Math.max(24,Math.min(W-24,player.x+dx*(195+speedLevel*29)*hero().spd*dt));player.y=Math.max(40,Math.min(H-24,player.y+dy*(195+speedLevel*29)*hero().spd*dt));if(len>.12)player.face=Math.atan2(dy,dx);player.inv=Math.max(0,player.inv-dt);
spawn-=dt;if(spawn<=0){if(enemies.length<90)for(let i=0;i<Math.min(3,1+Math.floor(wave/4));i++)spawnEnemy();spawn=Math.max(.34,1.2-wave*.075)}
for(const e of [...enemies]){e.hit=Math.max(0,e.hit-dt);const d=Math.max(1,dist(e,player));e.x+=(player.x-e.x)/d*e.speed*dt;e.y+=(player.y-e.y)/d*e.speed*dt;if(d<e.r+12&&player.inv<=0){player.hp-=e.boss?24:e.brute?17:10;player.inv=.72;if(player.hp<=0){end(false);return}}}
attack-=dt;if(attack<=0){if(sword()){attack=Math.max(.22,.63-slashLevel*.025);if(extraSword&&Math.random()<Math.min(.65,extraSword*.2))sword(.65)}}
for(let i=effects.length-1;i>=0;i--){effects[i].t-=dt;if(effects[i].t<=0)effects.splice(i,1)}if(bonus>0)bonus=Math.max(0,bonus-dt);hud()}
function draw(){ctx.fillStyle='#173c2d';ctx.fillRect(0,0,W,H);if(!player)return;ctx.save();ctx.translate(W/2-player.x*ZOOM,H/2-player.y*ZOOM);ctx.scale(ZOOM,ZOOM);ctx.fillStyle='#317849';ctx.fillRect(0,0,worldW(),worldH());ctx.fillStyle='#ffffff0b';for(let x=0;x<worldW();x+=60)ctx.fillRect(x,0,30,worldH());ctx.strokeStyle='#f0f5d0bb';ctx.lineWidth=3;ctx.strokeRect(17,40,worldW()-34,worldH()-80);for(let y=90;y<worldH()-40;y+=95){ctx.beginPath();ctx.moveTo(17,y);ctx.lineTo(worldW()-17,y);ctx.stroke()}ctx.strokeStyle='#f0f5d088';ctx.beginPath();ctx.moveTo(worldW()/2,40);ctx.lineTo(worldW()/2,worldH()-40);ctx.stroke();
for(const e of enemies){if(e.boss){oval(e.x,e.y+27,55,16,'#0b2b2388');oval(e.x,e.y+8,46,38,'#956342');oval(e.x,e.y-22,29,28,'#c1905b');oval(e.x-13,e.y-27,5,5,'#261d1a');oval(e.x+13,e.y-27,5,5,'#261d1a');ctx.strokeStyle='#f3d0a1';ctx.lineWidth=7;for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(e.x+side*15,e.y-42);ctx.lineTo(e.x+side*43,e.y-82);ctx.lineTo(e.x+side*57,e.y-96);ctx.moveTo(e.x+side*43,e.y-82);ctx.lineTo(e.x+side*34,e.y-107);ctx.stroke()}ctx.strokeStyle='#f17d31';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(e.x-54,e.y-93);ctx.lineTo(e.x+53,e.y-86);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText('BRUCE THE DEER',e.x,e.y+65);ctx.fillStyle='#4b2424';ctx.fillRect(e.x-55,e.y+70,110,8);ctx.fillStyle='#f4ad66';ctx.fillRect(e.x-55,e.y+70,110*Math.max(0,e.hp/e.maxHp),8)}else{enemy(e);if(e.brute){ctx.fillStyle='#d7b58a';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('BRUTE',e.x,e.y+28)}}}
if(!(player.inv>0&&Math.floor(clock*14)%2===0))mimi();
for(const f of effects){ctx.save();ctx.globalAlpha=Math.min(1,f.t*5);if(f.trail){circle(f.x,f.y,14,'#bd9bf5')}else if(f.hit){circle(f.x,f.y,f.critical?17:10,f.critical?'#ffdf76':'#f8b9a2')}else{ctx.translate(f.x,f.y);ctx.rotate(f.a);ctx.strokeStyle=f.power?'#ffcf73':'#ffefb0';ctx.lineWidth=f.power?15:9;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,0,f.power?105:67,-1.15,1.15);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,f.power?112:75,-1,1);ctx.stroke()}ctx.restore()}
if(bonus>0){ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff1b8';ctx.fillText('WAVE '+wave+'!',player.x,player.y-H*.2)}ctx.restore()}
function frame(t){const dt=Math.min(.04,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
const stick=$('stick'),nub=$('nub');function move(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y)||1,k=Math.min(1,l/48);joy.x=x/l*k;joy.y=y/l*k;nub.style.transform='translate('+joy.x*36+'px,'+joy.y*36+'px)'}function release(e){if(e&&joy.id!==e.pointerId)return;joy.down=false;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerdown',e=>{e.preventDefault();joy.down=true;joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',e=>{if(joy.down&&joy.id===e.pointerId)move(e)});stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
})();
</script></body></html>
