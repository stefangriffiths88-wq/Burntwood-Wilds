function openEarnedChest(){mode='chest';$('overlay').style.display='flex';$('panel').innerHTML='<h1>WELL-EARNED KIT BAG</h1><p>Dangerous opponent defeated. Choose one reward.</p><div id="earnedChoices"></div>';const first=canEvolve()?evolutionUpgrade():['FIREWORK ATTACKS','Your normal attacks burn enemies.',()=>weaponMods.flame++];drawMatchChoices($('earnedChoices'),[first,['SPECIAL PRACTICE','Shorten your special cooldown.',()=>{statsBuild.focus++;}],['ORANGE SLICES','Heal 35 HP and gain 10 maximum HP.',()=>{player.maxHp+=10;player.hp=Math.min(player.maxHp,player.hp+35);}]],()=>{mode='play';$('overlay').style.display='none';hud();saveRun();});}
function onEliteDefeated(e){coins+=6;dropExperience(e.x,e.y,8);eliteWins++;if(e.captain){captainDefeated=true;announceMatch('CAPTAIN DOWN!','Final evolution is now available.', '#ffe19d',2.6);}else announceMatch('GREAT TACKLE!','Pick up your reward.', '#ffe19d',2);if(chestDrops<2){chestDrops++;chests.push({x:e.x,y:e.y,life:999,earned:true});}effects.push({x:e.x,y:e.y,t:.5,ring:45,color:'#ffe19d'});}
function pickEnemyKind(family){let pool=family.slice();const charges=enemies.filter(e=>e.role==='charge').length,ranged=enemies.filter(e=>e.role==='ranged').length,support=enemies.filter(e=>e.role==='support').length;if(charges>=2)pool=pool.filter(k=>k!=='buck');if(ranged>=3)pool=pool.filter(k=>k!=='kicker');if(support>=1)pool=pool.filter(k=>k!=='coach');return pool.length?pool[Math.floor(Math.random()*pool.length)]:'deer';}
function matchElite(){if(enemies.length>=mobCap()){const plain=enemies.filter(e=>!e.boss&&!e.elite);if(!plain.length)return;const far=plain.reduce((a,e)=>dist(e,player)>dist(a,player)?e:a,plain[0]);enemies.splice(enemies.indexOf(far),1);}const stage=waveTime<55?0:waveTime<90?1:2,captain=waveTime>=95&&!captainSpawned,kind=captain?'coach':stage===0?'prop':stage===1?'kicker':'coach';if(!captain&&enemies.some(e=>e.elite))return;if(captain)captainSpawned=true;const a=rand(0,6.283),hp=captain?245:140+stage*35,e={x:Math.max(50,Math.min(worldW()-50,player.x+Math.cos(a)*300)),y:Math.max(70,Math.min(worldH()-50,player.y+Math.sin(a)*300)),hp,maxHp:hp,kind,vx:0,vy:0,hit:0,elite:true,captain};configureThreat(e);e.r*=1.2;e.mass*=1.5;e.spawnGrace=1.3;e.threatName=captain?'CLUB CAPTAIN':kind==='prop'?'HEAVY PROP':kind==='kicker'?'SHARP-SHOOTER':'COACH';enemies.push(e);announceMatch(captain?'THE CAPTAIN!':'DANGEROUS OPPONENT',captain?'Beat the Captain to earn your final evolution.':kind==='prop'?'Dodge the heavy shoulder and hit back.':kind==='kicker'?'Keep moving — watch the rugby balls.':'The coach makes nearby opponents stronger.','#ffdfad',2.4);}
function announceMatch(title,sub,color='#fff0b9',t=2){matchNotice={title,sub,color,t,max:t};}
function drawMatchNotice(){if(!matchNotice||matchNotice.t<=0)return;ctx.save();ctx.globalAlpha=Math.min(1,matchNotice.t*2);ctx.textAlign='center';ctx.fillStyle='#173744dc';ctx.beginPath();ctx.roundRect(18,H*.24,W-36,62,10);ctx.fill();ctx.fillStyle=matchNotice.color;ctx.font='bold 17px system-ui';ctx.fillText(matchNotice.title,W/2,H*.24+25);ctx.fillStyle='#eaf0e9';ctx.font='11px system-ui';ctx.fillText(matchNotice.sub,W/2,H*.24+45);ctx.restore();}
function recordBook(){try{return JSON.parse(localStorage.getItem('burntwood-wilds-records'))||{};}catch{return {};}}
function recordResult(win){const book=recordBook(),key=hero().name+'-'+activeStyle,old=book[key]||{plays:0,wins:0,bestKills:0,bestTime:0,bestStars:0};old.plays++;if(win)old.wins++;old.bestKills=Math.max(old.bestKills,kills);old.bestTime=Math.max(old.bestTime,Math.round(elapsed));const stars=win?(!reviveUsed&&eliteWins>=2?3:2):elapsed>=60?1:0;old.bestStars=Math.max(old.bestStars,stars);book[key]=old;try{localStorage.setItem('burntwood-wilds-records',JSON.stringify(book));}catch{}return {old,stars};}
function showMatchResult(win){if(!win&&trySecondWind())return;const {old,stars}=recordResult(win);clearSavedRun();player.rugbyCharge=null;player.overhype=null;glitterRain=null;mode='end';for(const id of ['stick','power','dash','ultimate','pauseBtn'])$(id).style.display='none';$('overlay').style.display='flex';$('panel').innerHTML='<h1>'+hero().name.toUpperCase()+(win?' BEAT BRUCE!':' • GREAT EFFORT!')+'</h1><div style="font-size:37px;letter-spacing:7px;color:#ffd877">'+Array.from({length:3},(_,i)=>i<stars?'★':'☆').join('')+'</div><p>'+kills+' opponents defeated • '+Math.round(elapsed)+' seconds<br>'+eliteWins+' dangerous opponents beaten</p><p style="font-size:12px;color:#d4e4df">'+activeStyle.toUpperCase()+' • PERSONAL BEST '+old.bestKills+' KILLS<br>'+old.wins+' WINS AS '+hero().name.toUpperCase()+'</p><button id="again" style="width:100%">PLAY AGAIN</button><button id="chooseCat" style="width:100%;font-size:15px;margin-top:10px">CHOOSE ANOTHER CAT</button>';$('again').onclick=()=>{unlockSound();reset();};$('chooseCat').onclick=returnToRoster;playTone(win?'level':'magic');}
function renderMatchOptions(){const f=$('familyMatch'),c=$('challengeMatch');if(f&&c){f.className=matchStyle==='family'?'selectedMode':'';c.className=matchStyle==='challenge'?'selectedMode':'';f.onclick=()=>{matchStyle='family';renderMatchOptions();renderSelect();};c.onclick=()=>{matchStyle='challenge';renderMatchOptions();renderSelect();};}const b=recordBook()[hero().name+'-'+matchStyle];const record=$('heroRecord');if(record)record.textContent=b?'PERSONAL BEST '+b.bestKills+' KILLS • '+b.wins+' WINS':'YOUR FIRST '+matchStyle.toUpperCase()+' MATCH';}
function drawPacedHUD(){ctx.save();ctx.textAlign='center';ctx.fillStyle='#fff0c3';ctx.font='bold 11px system-ui';ctx.fillText(bossPhase?'BRUCE • DODGE, THEN COUNTER':waveTime<25?'WARM-UP • COLLECT THE BLUE SPARKS':waveTime<60?'MATCH DAY • WATCH THE KICKERS':waveTime<95?'SECOND HALF • FIND THE COACH':'FINAL PUSH • BEAT THE CAPTAIN',W/2,H-13);if(waveTime<12){ctx.fillStyle='#e2f2dc';ctx.font='11px system-ui';ctx.fillText('Move • Auto attack • Dodge • Special',W/2,H-190);}ctx.restore();drawMatchNotice();}
function drawRugbyShots(){for(const l of loot){circle(l.x,l.y,8,l.heal?'#97e9b1':'#ffd677');ctx.fillStyle='#23373e';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(l.heal?'+':'£',l.x,l.y+4);}for(const b of shots){ctx.save();ctx.translate(b.x,b.y-45);ctx.scale(1,1/TILT);ctx.rotate(Math.atan2(b.vy,b.vx)+clock*5);ctx.fillStyle='#b47647';ctx.beginPath();ctx.ellipse(0,0,10,6,0,0,6.283);ctx.fill();ctx.strokeStyle='#fff0d1';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(5,0);for(let k=-1;k<=1;k++){ctx.moveTo(k*3,-2);ctx.lineTo(k*3,2);}ctx.stroke();ctx.restore();}}
function drawRewardPointers(){ctx.save();ctx.font='bold 10px system-ui';ctx.textAlign='center';for(const bag of chests){const sx=W/2+(bag.x-player.x)*ZOOM,sy=H/2+(bag.y-player.y)*ZOOM*TILT;if(sx>35&&sx<W-35&&sy>80&&sy<H-170)continue;const x=Math.max(36,Math.min(W-36,sx)),y=Math.max(105,Math.min(H-190,sy)),a=Math.atan2(sy-H/2,sx-W/2);ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#ffe59b';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-6,-6);ctx.lineTo(-6,6);ctx.fill();ctx.restore();ctx.fillStyle='#ffe59b';ctx.fillText('KIT BAG',x,y-12);}ctx.restore();}
function drawBossOpening(e){if(!e.boss||e.recover<=0)return;ctx.save();ctx.strokeStyle='#a9efc7';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(e.x,e.y,e.r+12,(e.r+12)*.55,0,0,6.283);ctx.stroke();ctx.restore();}
function drawProjectiles(){ctx.save();ctx.translate(0,-48);oldDrawProjectiles();ctx.restore();}
function drawEmbeddedArrows(e){ctx.save();ctx.translate(0,-48);oldDrawEmbeddedArrows(e);ctx.restore();}

function drawExtra(){drawRugbyShots();}
function frame(t){const dt=Math.min(.04,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
const stick=$('stick'),nub=$('nub');function move(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y)||1,k=Math.min(1,l/48);joy.x=x/l*k;joy.y=y/l*k;nub.style.transform='translate('+joy.x*36+'px,'+joy.y*36+'px)'}function release(e){if(e&&joy.id!==e.pointerId)return;joy.down=false;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerdown',e=>{e.preventDefault();joy.down=true;joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',e=>{if(joy.down&&joy.id===e.pointerId)move(e)});stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
})();
</script></body></html>
