name: Jackson top-down browser check
on:
  push:
    branches: [jackson-topdown-rugby-v1]
    paths: ['.github/workflows/jackson-topdown-check.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.48.2
      - run: |
          python3 -m http.server 8765 > /tmp/rugby-server.log 2>&1 &
          node tests/jackson-topdown-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackson-topdown-browser
          path: rugby-*.png
