name: Jackson movement browser check
on:
  push:
    branches: [jackson-movement-v2]
    paths: ['.github/workflows/jackson-movement-check.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.48.2
      - name: Render and exercise practice pitch
        run: |
          python3 -m http.server 8765 > /tmp/jackson-server.log 2>&1 &
          node tests/jackson-v2-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackson-v2-browser
          path: jackson-*.png
