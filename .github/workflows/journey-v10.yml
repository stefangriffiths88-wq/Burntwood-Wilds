name: Modular journey test 10
on:
  push:
    branches: ['**']
    paths: ['burntwood-journey-v10.html', 'journey-v10/**', '.github/workflows/journey-v10.yml']
  workflow_dispatch:
concurrency:
  group: journey-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Scope validation to the changed files
        id: scope
        run: |
          python3 - <<'PY_SCOPE'
          import subprocess, os
          files=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines()
          def presentation_or_test(p):
              return p.endswith('.md') or p.endswith('-browser.cjs') or p == 'journey-v10/menu.css' or (p.startswith('burntwood-journey-v10') and p.endswith('.html'))
          rugby_owned={'journey-v10/arenas/rugby-route.js','journey-v10/arenas/rugby-route-art.js','journey-v10/rugby-route-test.cjs','journey-v10/rugby-route-browser.cjs'}
          # Rugby-only followups have all-ten route contracts and actual-navigation phone coverage.
          # Shared runtime changes and workflow-only changes still require the complete mechanics gate.
          rugby_only=any(p in rugby_owned for p in files) and all(p in rugby_owned or p.endswith('.md') or p=='.github/workflows/journey-v10.yml' for p in files)
          full=not files or not (rugby_only or all(presentation_or_test(p) for p in files))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('full='+str(full).lower()+'\n')
          print('Full mechanics suite:',full,'; changed files:',', '.join(files))
          PY_SCOPE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 journey-v10/assets/import_legacy_portraits.py
          python3 journey-v10/build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add burntwood-journey-v10.html burntwood-journey-v10.*.html journey-v10/game.js journey-v10/assets/portraits
          git diff --cached --quiet || (git commit -m "Generate versioned artwork assets and playable build" && (git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"))
      - if: steps.scope.outputs.full == 'true'
        run: node journey-v10/test.cjs
      - if: steps.scope.outputs.full == 'true'
        run: node journey-v10/joseph-test.cjs
      - if: steps.scope.outputs.full == 'true'
        run: node journey-v10/tom-test.cjs
      - if: steps.scope.outputs.full == 'true'
        run: node journey-v10/havannah-test.cjs
      - if: steps.scope.outputs.full == 'true'
        run: node journey-v10/builds-test.cjs
      - if: steps.scope.outputs.full == 'true'
        run: node journey-v10/reward-balance-test.cjs
      - if: steps.scope.outputs.full == 'true'
        run: node journey-v10/levelup-reveal-test.cjs
      - if: steps.scope.outputs.full == 'true'
        run: node journey-v10/reward-world-test.cjs
      - if: steps.scope.outputs.full == 'true'
        run: node journey-v10/town-test.cjs
      - if: steps.scope.outputs.full == 'true'
        run: node journey-v10/encounters-test.cjs
      - run: npm install --no-save playwright@1.48.2
      - run: |
          python3 -m http.server 8765 >/tmp/journey-server.log 2>&1 &
          node journey-v10/reward-world-browser.cjs
          node journey-v10/rewards-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changed-screens
          path: journey-v10/browser
      - if: steps.scope.outputs.full == 'true'
        run: |
          node journey-v10/browser.cjs
          node journey-v10/joseph-browser.cjs
          node journey-v10/tom-browser.cjs
          node journey-v10/havannah-browser.cjs
          node journey-v10/visuals-browser.cjs
          node journey-v10/levelup-reveal-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-review
          path: journey-v10/browser
      - if: steps.scope.outputs.full == 'true'
        run: node journey-v10/charms-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-browser
          path: |
            journey-v10/browser
            journey-v10/charm-test-results.json
            journey-v10/reward-balance-results.json
  changed-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 journey-v10/build.py
      - run: |
          node journey-v10/harvey-test.cjs
          node journey-v10/immy-test.cjs
          node journey-v10/roster-workshop-test.cjs
      - run: node journey-v10/reward-flow-test.cjs
      - run: node journey-v10/rugby-route-test.cjs
      - run: node journey-v10/monster-town-test.cjs
      - run: node journey-v10/sankeys-charms-test.cjs
      - run: npm install --no-save playwright@1.48.2
      - run: |
          python3 -m http.server 8765 >/tmp/monster-server.log 2>&1 &
          node journey-v10/sankeys-charms-browser.cjs
          node journey-v10/upgrade-layout-browser.cjs
          node journey-v10/harvey-browser.cjs
          node journey-v10/immy-browser.cjs
          node journey-v10/roster-workshop-browser.cjs
          node journey-v10/reward-flow-browser.cjs
          node journey-v10/monster-town-browser.cjs
          node journey-v10/rugby-route-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-phone-review
          path: journey-v10/browser
