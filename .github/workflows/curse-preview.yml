name: Curse Pages preview verification
on:
  push:
    paths: ['ops/package_curse_preview.py', 'ops/curse_preview_browser.cjs', '.github/workflows/curse-preview.yml', 'journey-v10/world/curse-story.js', 'journey-v10/visuals/curse-art.js']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 journey-v10/build.py
      - run: python3 ops/package_curse_preview.py
      - run: npm install --no-save playwright@1.48.2
      - run: |
          python3 -m http.server 8765 >/tmp/curse-preview-server.log 2>&1 &
          node ops/curse_preview_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-curse-preview
          path: |
            burntwood-preview-v10.31.0.html
            tests/curse-preview-10.31.json
            journey-v10/browser
