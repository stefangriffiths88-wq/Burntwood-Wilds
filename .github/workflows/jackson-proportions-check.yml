name: Jackson proportion check
on:
  push:
    branches: [jackson-measured-proportions-v3]
    paths: ['.github/workflows/jackson-proportions-check.yml', 'cat-movement-lab-v3.html']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.48.2
      - run: |
          python3 -m http.server 8765 > /tmp/proportions-server.log 2>&1 &
          node tests/jackson-proportions-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackson-proportions
          path: proportions-*.png
