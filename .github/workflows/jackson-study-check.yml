name: Jackson study browser check
on:
  push:
    branches: [jackson-proportions-movement-v2]
    paths: ['.github/workflows/jackson-study-check.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.48.2
      - name: Check movement study
        run: |
          python3 -m http.server 8765 > /tmp/study-server.log 2>&1 &
          node tests/jackson-study-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackson-study-browser
          path: study-*.png
