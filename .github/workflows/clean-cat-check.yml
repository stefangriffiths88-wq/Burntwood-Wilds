name: Clean cat browser check
on:
  push:
    branches: [clean-cat-movement-v1]
    paths: ['.github/workflows/clean-cat-check.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.48.2
      - name: Check movement lab
        run: |
          python3 -m http.server 8765 > /tmp/cat-server.log 2>&1 &
          node tests/clean-cat-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-cat-browser
          path: cat-*.png
