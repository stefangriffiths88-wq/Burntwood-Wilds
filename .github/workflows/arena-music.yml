name: Arena music focused verification
on:
  push:
    paths: ['journey-v10/ui/audio.js', 'journey-v10/arena-music-test.cjs', 'journey-v10/arena-music-browser.cjs', 'ops/package_music_preview.py', '.github/workflows/arena-music.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 journey-v10/build.py
      - run: python3 ops/package_music_preview.py
      - run: node --check journey-v10/game.js
      - run: node journey-v10/arena-music-test.cjs
      - run: node journey-v10/sankeys-charms-test.cjs
      - run: npm install --no-save playwright@1.48.2
      - run: |
          python3 -m http.server 8765 >/tmp/music-server.log 2>&1 &
          node journey-v10/arena-music-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-music-review
          path: |
            burntwood-preview-music.html
            tests/music-preview.json
            tests/arena-music-browser.json
