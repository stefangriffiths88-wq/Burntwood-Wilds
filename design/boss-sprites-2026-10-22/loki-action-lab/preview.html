// Standalone timing/interaction laboratory. No game globals, saves or network.
class LokiActionLab {
 constructor(){this.reset();}
 reset(){this.player={x:115,y:325,hp:100,inv:0,cooldown:0,dash:0,dx:1,dy:0};this.boss={x:275,y:235};this.phase='ready';this.elapsed=0;this.clock=0;this.target=null;this.locked=false;this.remaining=0;this.pounceIndex=0;this.particles=[];this.message='Choose a pounce test';this.paused=false;this.lastMove={x:0,y:-1};this.events=[];}
 start(count=1){if(!['ready','rescued'].includes(this.phase))return false;this.remaining=count===2?2:1;this.pounceIndex=0;this.target=null;this.locked=false;this.setPhase('guardian');return true;}
 setPhase(phase){this.phase=phase;this.elapsed=0;this.events.push({phase,time:this.clock});this.message={guardian:'Guardian stance · approaching',crouch:'Playful crouch · watch the landing marker',air:'Large pounce',recover:'Landing · opening to attack',ready:'Ready for another test',rescued:'Loki rescued · relaxed stance'}[phase]||phase;}
 rescue(){this.setPhase('rescued');this.remaining=0;this.target=null;this.locked=false;this.particles=[];}
 dodge(){let p=this.player;if(this.paused||p.cooldown>0)return false;p.cooldown=1.3;p.inv=.3;p.dash=.17;let q=this.lastMove,n=Math.hypot(q.x,q.y)||1;p.dx=q.x/n;p.dy=q.y/n;return true;}
 step(dt,input={x:0,y:0}){
  if(this.paused)return;dt=Math.min(.1,Math.max(0,dt));this.clock+=dt;this.elapsed+=dt;
  let p=this.player,n=Math.hypot(input.x,input.y),ux=n?input.x/Math.max(1,n):0,uy=n?input.y/Math.max(1,n):0;
  if(n>.05)this.lastMove={x:ux,y:uy};p.cooldown=Math.max(0,p.cooldown-dt);p.inv=Math.max(0,p.inv-dt);
  let speed=p.dash>0?450:125,mx=p.dash>0?p.dx:ux,my=p.dash>0?p.dy:uy;p.dash=Math.max(0,p.dash-dt);
  p.x=Math.max(24,Math.min(366,p.x+mx*speed*dt));p.y=Math.max(105,Math.min(394,p.y+my*speed*dt));
  for(let f of this.particles)f.life-=dt;this.particles=this.particles.filter(f=>f.life>0);
  let b=this.boss;
  if(this.phase==='guardian'){
   let dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1;if(d>160){b.x+=dx/d*28*dt;b.y+=dy/d*28*dt;}
   if(this.elapsed>=.75){this.pounceIndex++;this.locked=false;this.target={x:p.x,y:p.y};this.setPhase('crouch');}
  }else if(this.phase==='crouch'){
   let lockAt=this.pounceIndex>1?.5:.68,launchAt=this.pounceIndex>1?.9:1.1;
   if(!this.locked){this.target={x:p.x,y:p.y};if(this.elapsed>=lockAt){this.locked=true;this.message='Target locked · move or dodge';this.events.push({phase:'locked',time:this.clock,target:{...this.target}});}}
   if(this.elapsed>=launchAt){this.from={...b};this.airDuration=this.pounceIndex>1?.58:.68;this.setPhase('air');}
  }else if(this.phase==='air'){
   let u=Math.min(1,this.elapsed/this.airDuration);b.x=this.from.x+(this.target.x-this.from.x)*u;b.y=this.from.y+(this.target.y-this.from.y)*u;
   if(u>=1){let d=Math.hypot(p.x-b.x,p.y-b.y),hit=d<59&&p.inv<=0;if(hit)p.hp=Math.max(0,p.hp-20);this.events.push({phase:'impact',time:this.clock,hit,target:{...this.target}});this.particles.push({x:b.x,y:b.y,life:.5,hit});this.remaining--;this.setPhase('recover');this.message=hit?'Hit · −20 health':d<59?'Dodged · invulnerable at landing':'Missed · you cleared the landing';}
  }else if(this.phase==='recover'&&this.elapsed>=(this.remaining>0?.65:1.35)){
   if(this.remaining>0){this.pounceIndex++;this.target={x:p.x,y:p.y};this.locked=false;this.setPhase('crouch');}else{this.target=null;this.setPhase('ready');}
  }
 }
 get height(){return this.phase==='air'?Math.sin(Math.min(1,this.elapsed/this.airDuration)*Math.PI)*72:0;}
 get active(){return !this.paused&&(!['ready','rescued'].includes(this.phase)||this.player.cooldown>0||this.player.inv>0||this.particles.length>0);}
}

const TAU=Math.PI*2;
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);ctx.fill();}
function line(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();}
// Shared drawing primitives only. Character modules own outfits and silhouettes.
// Numbers are world units; no combat state, collision or stats are changed here.
function catShape(path,color,ink='#33413c',width=.85){let shape=new Path2D(path);ctx.fillStyle=color;ctx.fill(shape);if(ink){ctx.strokeStyle=ink;ctx.lineWidth=width;ctx.stroke(shape);}}
function catOval(x,y,rx,ry,color,ink='#33413c'){ellipse(x,y,rx,ry,color);if(ink){ctx.strokeStyle=ink;ctx.lineWidth=.8;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.stroke();}}
function catTail(fur,tip,width=6){ctx.lineWidth=width;ctx.strokeStyle=fur;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(9,12);ctx.bezierCurveTo(29,28,38,4+Math.sin(performance.now()/900)*3,26,Math.sin(performance.now()/900)*3);ctx.stroke();line([[26,0],[25,3]],tip,width-1);}
function catFace({fur,cream,eye,ink='#5a5548',wide=16,back=false}){
 for(let s of [-1,1]){catShape(`M ${s*5} -25 L ${s*13} -36 Q ${s*18} -29 ${s*15} -18 Z`,fur,ink);catShape(`M ${s*9} -26 L ${s*12} -31 L ${s*13} -22 Z`,'#d9a0a1',null);}
 catOval(0,-15,wide,15,fur,ink);ellipse(-4,-20,wide*.65,6,'#ffffff13');
 if(back){line([[-8,-22],[0,-25],[8,-22]],cream,2);return;}
 ellipse(0,-7,wide*.66,6,cream);let blink=performance.now()%4300>4140,hurtFace=!!(p&&p.inv>0&&hitFlash>0);for(let s of [-1,1]){if(blink||hurtFace){line([[s*6-3,-15],[s*6,-14],[s*6+3,-15]],ink,1.4);continue;}catOval(s*6,-15,3.8,4.7,'#fff5df',ink);ellipse(s*6,-14.8,2.3,3.6,eye);ellipse(s*6,-14.6,1,2.7,'#23372d');ellipse(s*6-1,-16.6,.9,1.1,'#fff');line([[s*3,-22],[s*10,-23]],ink,1.2);line([[s*(wide-1),-11],[s*(wide-4),-9]],ink,.8);}
 ellipse(0,-7,1.8,1.2,'#c58c8c');line([[0,-6],[0,-4],[-2,-3]],ink,.8);line([[0,-4],[3,-3]],ink,.8);for(let s of [-1,1])ellipse(s*10,-7,2.4,1,'#d58f8a44');
}
function catPaw(x,y,size,fur,pad='#cf9da8',angle=0){ctx.save();ctx.translate(x,y);ctx.rotate(angle);catOval(0,0,size,size*1.05,fur);ellipse(0,1,size*.43,size*.38,pad);for(let n of [-1,0,1])ellipse(n*size*.4,-size*.38,size*.16,size*.2,pad);ctx.restore();}
function catVisualScale(x,y,sx,sy,draw){ctx.save();try{ctx.translate(x,y);ctx.scale(sx,sy);ctx.translate(-x,-y);draw();}finally{ctx.restore();}}

function heroBlink(){return performance.now()%4300>4140||!!(p&&p.inv>0&&hitFlash>0);}

function ballArt(x,y,r,angle=0,small=false){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ellipse(1,3,r*.75,r*.48,'#203b3544');ellipse(0,0,r,r*.59,small?'#ffe4a0':'#fff3d6');line([[-r*.57,-r*.42],[-r*.75,0],[-r*.57,r*.42]],'#c5413c',r*.19);line([[r*.57,-r*.42],[r*.75,0],[r*.57,r*.42]],'#c5413c',r*.19);line([[-r*.22,0],[r*.22,0]],'#a08b68',1);ctx.restore();}

function drawJacksonSprite(c,x,y,s,type){c.save();c.translate(x,y);c.scale(s*.9272,s*.9272);
 ellipse(0,23,13,3.4,'#18372855');catTail('#83969b','#dfdfce',5.2);
 catShape('M -10 -5 Q 0 -10 10 -5 L 10 15 Q 0 24 -10 15 Z','#148461');
 ctx.save();let jersey=new Path2D('M -10 -5 Q 0 -10 10 -5 L 10 15 Q 0 24 -10 15 Z');ctx.clip(jersey);for(let y of [-1,8,17]){ctx.fillStyle='#bd493f';ctx.fillRect(-12,y,24,4.5);}line([[-8,4],[-8,14]],'#ffffff25',1.2);ctx.restore();
 line([[-7,-5],[0,-1],[7,-5]],'#f2e5cf',2);catShape('M 4 0 L 8 0 L 8 5 Q 6 7 4 5 Z','#e9d8b2',null);line([[6,1],[6,4]],'#55806c',.8);
 catFace({fur:'#98a9ac',cream:'#e8e3ce',eye:'#357e99',wide:15});
 catShape('M -14 -22 Q -13 -35 -3 -31 Q 6 -36 14 -24 Q 7 -27 0 -19 L 0 -25 Q -7 -20 -14 -22 Z','#765139');line([[-10,-27],[-4,-29],[5,-28]],'#b88a5d',1.2);
 let swing=Math.sin((p?.walk||0)*2)*1.3,throwing=p?.throwT>0?Math.sin(p.throwT/.2*Math.PI)*7:0;
 catPaw(-23,5+swing,4.8,'#e8e3ce');catPaw(23,3-swing-throwing,4.8,'#e8e3ce');if(!throwing)ballArt(27,-3,6,-.45);c.restore();}


function oval(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();}
function draw(){
 ctx.setTransform(2,0,0,2,0,0);ctx.fillStyle='#52734b';ctx.fillRect(0,0,390,420);
 ctx.fillStyle='#668653';ctx.fillRect(12,68,366,337);ctx.strokeStyle='#d8d7b18c';ctx.lineWidth=1.5;ctx.strokeRect(28,88,334,300);ctx.beginPath();ctx.moveTo(28,238);ctx.lineTo(362,238);ctx.stroke();ctx.beginPath();ctx.arc(195,238,42,0,TAU);ctx.stroke();
 ctx.fillStyle='#38234820';ctx.fillRect(0,68,390,352);
 const b=lab.boss,q=lab.player;
 if(lab.target&&['crouch','air'].includes(lab.phase)){
  let r=54,color=lab.locked?'#f0ad79':'#ead493';ctx.fillStyle=lab.locked?'#c77e623b':'#d5b76022';ctx.strokeStyle=color;ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(lab.target.x,lab.target.y,r,r*.55,0,0,TAU);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(lab.target.x-7,lab.target.y);ctx.lineTo(lab.target.x+7,lab.target.y);ctx.moveTo(lab.target.x,lab.target.y-6);ctx.lineTo(lab.target.x,lab.target.y+6);ctx.stroke();
 }
 oval(b.x,b.y+3,45-(lab.height*.15),12-(lab.height*.025),'#173b3255');
 let pose=lab.phase==='rescued'?'relaxed':lab.phase==='crouch'?'playful':'guardian',im=images[pose];
 if(im){
  let w=pose==='playful'?155:127,h=w*im.height/im.width;
  let bob=lab.phase==='guardian'?Math.sin(lab.clock*8)*1.4:0,tilt=lab.phase==='air'?-.08*Math.sin(lab.elapsed/lab.airDuration*Math.PI):0;
  let right=lab.phase==='air'?lab.target.x>lab.from.x:lab.target?lab.target.x>b.x:q.x>b.x;
  ctx.save();ctx.translate(b.x,Math.max(h+65,b.y-lab.height+bob));if(right)ctx.scale(-1,1);ctx.rotate(tilt);ctx.drawImage(im,-w*.5,-h+10,w,h);ctx.restore();
 }
 for(let f of lab.particles){let age=1-f.life/.5;ctx.strokeStyle=f.hit?'#e9af88':'#dbd2a0';ctx.lineWidth=(1-age)*5;ctx.globalAlpha=1-age;ctx.beginPath();ctx.ellipse(f.x,f.y,20+age*57,7+age*25,0,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
 p.walk=lab.clock*(Math.hypot(input().x,input().y)>.05?7:0);p.inv=q.inv;ctx.save();if(q.inv>0)ctx.globalAlpha=.6;drawJacksonSprite(ctx,q.x,q.y,.7366667,'jackson');ctx.restore();
 if(q.inv>0){ctx.strokeStyle='#d4edcc';ctx.lineWidth=2;ctx.beginPath();ctx.arc(q.x,q.y-7,19,0,TAU);ctx.stroke();}
 if(joystick){oval(joystick.x,joystick.y,34,34,'#d3ddbc33');oval(joystick.x+joystick.dx*25,joystick.y+joystick.dy*25,12,12,'#efe4bc88');}
 ctx.fillStyle='#163d31';ctx.fillRect(0,0,390,63);ctx.fillStyle='#f2dca4';ctx.font='bold 13px system-ui';ctx.textAlign='left';ctx.fillText('LOKI · ACTION TEST',13,21);ctx.textAlign='right';ctx.fillText('JACKSON '+q.hp+'/100',377,21);
 ctx.fillStyle='#b5c5a7';ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillText(({ready:'Guardian stance',guardian:'Guardian stance',crouch:'Playful crouch',air:'Pounce',recover:'Recovery',rescued:'Relaxed · rescued'})[lab.phase],13,43);
 ctx.textAlign='right';ctx.fillText('ISOLATED · NO GAME SAVE',377,43);
 if(lab.paused){ctx.fillStyle='#12392bbf';ctx.fillRect(0,63,390,357);ctx.fillStyle='#ffe5a6';ctx.textAlign='center';ctx.font='bold 18px system-ui';ctx.fillText('PAUSED',195,230);}
 status.textContent=lab.paused?'Paused':lab.message;
 root.querySelector('[data-action="pause"]').textContent=lab.paused?'Resume':'Pause';
 const dodge=root.querySelector('[data-action="dodge"]');dodge.disabled=q.cooldown>0||lab.paused;dodge.textContent=q.cooldown>0?'Dodge '+q.cooldown.toFixed(1)+'s':'Dodge';
 for(let a of ['pounce','double'])root.querySelector('[data-action="'+a+'"]').disabled=lab.paused||!['ready','rescued'].includes(lab.phase);
}
function input(){return{x:(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+(joystick?.dx||0),y:(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+(joystick?.dy||0)};}
function wake(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame);}else if(!raf)draw();}
function frame(now){raf=0;let dt=Math.min(.1,(now-last)/1000);last=now;lab.step(dt,input());draw();if(!lab.paused&&(lab.active||Object.values(keys).some(Boolean)||joystick))raf=requestAnimationFrame(frame);}
for(let b of root.querySelectorAll('[data-action]'))b.addEventListener('click',()=>{
 let a=b.dataset.action;if(a==='pounce')lab.start(1);else if(a==='double')lab.start(2);else if(a==='rescue')lab.rescue();else if(a==='reset'){lab.reset();keys={};joystick=null;}else if(a==='dodge')lab.dodge();else if(a==='pause'){lab.paused=!lab.paused;keys={};joystick=null;}
 draw();wake();
});
root.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d',' '].includes(e.key)){e.preventDefault();if(lab.paused)return;if(e.key===' ')lab.dodge();else keys[e.key]=true;wake();}});
window.addEventListener('keyup',e=>{keys[e.key]=false;});
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*390/r.width,y:(e.clientY-r.top)*420/r.height};}
canvas.addEventListener('pointerdown',e=>{let q=point(e);if(q.x>240||q.y<90||lab.paused||joystick)return;joystick={id:e.pointerId,x:q.x,y:q.y,dx:0,dy:0};canvas.setPointerCapture?.(e.pointerId);e.preventDefault();wake();});
canvas.addEventListener('pointermove',e=>{if(joystick?.id!==e.pointerId)return;let q=point(e),dx=(q.x-joystick.x)/32,dy=(q.y-joystick.y)/32,n=Math.max(1,Math.hypot(dx,dy));joystick.dx=dx/n;joystick.dy=dy/n;e.preventDefault();wake();});
function release(e){if(joystick?.id===e.pointerId){joystick=null;draw();}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
function interrupt(){keys={};joystick=null;if(lab.active)lab.paused=true;if(raf){cancelAnimationFrame(raf);raf=0;}draw();}
document.addEventListener('visibilitychange',()=>{if(document.hidden)interrupt();});window.addEventListener('blur',interrupt);
root.actionLab={get lab(){return lab;},draw,wake,images,input};
Promise.all(Object.entries(urls).map(([name,url])=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{images[name]=im;resolve();};im.onerror=reject;im.src=url;}))).then(()=>draw()).catch(()=>{status.textContent='Could not load Loki artwork';});
})();
