<div id="burntwood-boss-review">
  <div class="viz-row" role="group" aria-label="Boss pose">
    <button class="btn" type="button" data-pose="stalk" aria-pressed="true">Ready</button>
    <button class="btn" type="button" data-pose="warning" aria-pressed="false">Attack tell</button>
    <button class="btn" type="button" data-pose="attack" aria-pressed="false">Strike</button>
    <button class="btn" type="button" data-pose="freed" aria-pressed="false">Loki rescued</button>
  </div>
  <div class="boss-review-grid">
    <figure><h3>Rubble Trouble</h3><div class="text-small">Quarry golem · reworked shape</div><canvas data-boss="quarry" width="780" height="640" role="img" aria-label="Hunched heap of craggy quarry stone with giant mismatched fists, an embedded face and a crooked chipped grin, beside Jackson at gameplay scale"></canvas></figure>
    <figure><h3>Loki</h3><div class="text-small">Black-and-white husky · fluffy brush tail</div><canvas data-boss="park" width="780" height="640" role="img" aria-label="Giant black and white husky with a large fluffy feathered tail, blue eyes and cursed violet collar, beside Jackson at gameplay scale"></canvas></figure>
  </div>
</div>
<style>
#burntwood-boss-review .boss-review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px;margin-top:16px}
#burntwood-boss-review figure{margin:0;min-width:0}
#burntwood-boss-review h3{margin:0 0 4px}
#burntwood-boss-review canvas{display:block;width:100%;height:auto;margin-top:8px;background:#254133;border-radius:12px}
@media(max-width:550px){#burntwood-boss-review .boss-review-grid{grid-template-columns:1fr}}
</style>
<script>
(()=>{
const root=document.getElementById('burntwood-boss-review');
let ctx,pose='stalk',p={walk:0,throwT:0,inv:0},hitFlash=0;
const TAU=Math.PI*2;
// Shared drawing primitives only. Character modules own outfits and silhouettes.
// Numbers are world units; no combat state, collision or stats are changed here.
function catShape(path,color,ink='#33413c',width=.85){let shape=new Path2D(path);ctx.fillStyle=color;ctx.fill(shape);if(ink){ctx.strokeStyle=ink;ctx.lineWidth=width;ctx.stroke(shape);}}
function catOval(x,y,rx,ry,color,ink='#33413c'){ellipse(x,y,rx,ry,color);if(ink){ctx.strokeStyle=ink;ctx.lineWidth=.8;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.stroke();}}
function catTail(fur,tip,width=6){ctx.lineWidth=width;ctx.strokeStyle=fur;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(9,12);ctx.bezierCurveTo(29,28,38,4+Math.sin(performance.now()/900)*3,26,Math.sin(performance.now()/900)*3);ctx.stroke();line([[26,0],[25,3]],tip,width-1);}
function catFace({fur,cream,eye,ink='#5a5548',wide=16,back=false}){
 for(let s of [-1,1]){catShape(`M ${s*5} -25 L ${s*13} -36 Q ${s*18} -29 ${s*15} -18 Z`,fur,ink);catShape(`M ${s*9} -26 L ${s*12} -31 L ${s*13} -22 Z`,'#d9a0a1',null);}
 catOval(0,-15,wide,15,fur,ink);ellipse(-4,-20,wide*.65,6,'#ffffff13');
 if(back){line([[-8,-22],[0,-25],[8,-22]],cream,2);return;}
 ellipse(0,-7,wide*.66,6,cream);let blink=performance.now()%4300>4140,hurtFace=!!(p&&p.inv>0&&hitFlash>0);for(let s of [-1,1]){if(blink||hurtFace){line([[s*6-3,-15],[s*6,-14],[s*6+3,-15]],ink,1.4);continue;}catOval(s*6,-15,3.8,4.7,'#fff5df',ink);ellipse(s*6,-14.8,2.3,3.6,eye);ellipse(s*6,-14.6,1,2.7,'#23372d');ellipse(s*6-1,-16.6,.9,1.1,'#fff');line([[s*3,-22],[s*10,-23]],ink,1.2);line([[s*(wide-1),-11],[s*(wide-4),-9]],ink,.8);}
 ellipse(0,-7,1.8,1.2,'#c58c8c');line([[0,-6],[0,-4],[-2,-3]],ink,.8);line([[0,-4],[3,-3]],ink,.8);for(let s of [-1,1])ellipse(s*10,-7,2.4,1,'#d58f8a44');
}
function catPaw(x,y,size,fur,pad='#cf9da8',angle=0){ctx.save();ctx.translate(x,y);ctx.rotate(angle);catOval(0,0,size,size*1.05,fur);ellipse(0,1,size*.43,size*.38,pad);for(let n of [-1,0,1])ellipse(n*size*.4,-size*.38,size*.16,size*.2,pad);ctx.restore();}
function catVisualScale(x,y,sx,sy,draw){ctx.save();try{ctx.translate(x,y);ctx.scale(sx,sy);ctx.translate(-x,-y);draw();}finally{ctx.restore();}}

function heroBlink(){return performance.now()%4300>4140||!!(p&&p.inv>0&&hitFlash>0);}

function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);ctx.fill();}
function line(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();}
function bossStone(x,y,w,h,base='#69736a',light='#b8b9a0'){ctx.save();ctx.translate(x,y);let g=ctx.createLinearGradient(-w/2,-h/2,w/2,h/2);g.addColorStop(0,light);g.addColorStop(.45,base);g.addColorStop(1,'#3c4942');catShape(`M${-w*.48} ${-h*.24}L${-w*.2} ${-h*.53}L${w*.31} ${-h*.46}L${w*.52} ${-h*.04}L${w*.39} ${h*.39}L${-w*.18} ${h*.51}L${-w*.52} ${h*.15}Z`,g,'#293d35',1.3);catShape(`M${-w*.48} ${-h*.24}L${-w*.2} ${-h*.53}L${w*.31} ${-h*.46}L${w*.08} ${-h*.19}L${-w*.18} ${-h*.06}Z`,'#d6ceb033',null);line([[-w*.39,-h*.23],[-w*.17,-h*.43],[w*.25,-h*.37]],'#ece0ba88',1);line([[-w*.15,-h*.05],[w*.1,h*.1],[w*.02,h*.31]],'#334a40',.8);for(let i=0;i<5;i++)ellipse(-w*.3+(i*7%Math.max(1,w*.65)),-h*.2+(i*11%Math.max(1,h*.5)),.65,.65,'#e6d8aa66');ctx.restore();}
function bossLeaf(x,y,size,angle,color='#78945b'){ctx.save();ctx.translate(x,y);ctx.rotate(angle);catShape(`M0 ${size*.5}Q${-size} ${-size*.2} 0 ${-size}Q${size*.8} ${-size*.15} 0 ${size*.5}Z`,color,'#38543b',.65);line([[0,size*.3],[0,-size*.7]],'#c5ca8766',.7);ctx.restore();}
function bossEyes(y,space=9,color='#dca557'){for(let s of [-1,1]){wildOval(s*space,y,6,6.7,'#e7dbc0','#fff1ca');ellipse(s*space+.5,y+.5,3.5,4.7,color);ellipse(s*space+.7,y+.7,1.6,3.8,'#21332e');ellipse(s*space-1.2,y-1.8,1.3,1.6,'#fff6d9');}}

function wildOval(x,y,rx,ry,base,light=base){let g=ctx.createLinearGradient(x-rx,y-ry,x+rx,y+ry);g.addColorStop(0,light);g.addColorStop(1,base);catOval(x,y,rx,ry,g,'#263b36');}
function ballArt(x,y,r,angle=0,small=false){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ellipse(1,3,r*.75,r*.48,'#203b3544');ellipse(0,0,r,r*.59,small?'#ffe4a0':'#fff3d6');line([[-r*.57,-r*.42],[-r*.75,0],[-r*.57,r*.42]],'#c5413c',r*.19);line([[r*.57,-r*.42],[r*.75,0],[r*.57,r*.42]],'#c5413c',r*.19);line([[-r*.22,0],[r*.22,0]],'#a08b68',1);ctx.restore();}

function drawJacksonSprite(c,x,y,s,type){c.save();c.translate(x,y);c.scale(s*.9272,s*.9272);
 ellipse(0,23,13,3.4,'#18372855');catTail('#83969b','#dfdfce',5.2);
 catShape('M -10 -5 Q 0 -10 10 -5 L 10 15 Q 0 24 -10 15 Z','#148461');
 ctx.save();let jersey=new Path2D('M -10 -5 Q 0 -10 10 -5 L 10 15 Q 0 24 -10 15 Z');ctx.clip(jersey);for(let y of [-1,8,17]){ctx.fillStyle='#bd493f';ctx.fillRect(-12,y,24,4.5);}line([[-8,4],[-8,14]],'#ffffff25',1.2);ctx.restore();
 line([[-7,-5],[0,-1],[7,-5]],'#f2e5cf',2);catShape('M 4 0 L 8 0 L 8 5 Q 6 7 4 5 Z','#e9d8b2',null);line([[6,1],[6,4]],'#55806c',.8);
 catFace({fur:'#98a9ac',cream:'#e8e3ce',eye:'#357e99',wide:15});
 catShape('M -14 -22 Q -13 -35 -3 -31 Q 6 -36 14 -24 Q 7 -27 0 -19 L 0 -25 Q -7 -20 -14 -22 Z','#765139');line([[-10,-27],[-4,-29],[5,-28]],'#b88a5d',1.2);
 let swing=Math.sin((p?.walk||0)*2)*1.3,throwing=p?.throwT>0?Math.sin(p.throwT/.2*Math.PI)*7:0;
 catPaw(-23,5+swing,4.8,'#e8e3ce');catPaw(23,3-swing-throwing,4.8,'#e8e3ce');if(!throwing)ballArt(27,-3,6,-.45);c.restore();}


const WORLD={w:900,h:1300};

function drawQuarry(){ctx.fillStyle='#887a61';ctx.fillRect(0,0,WORLD.w,WORLD.h);for(let i=0;i<22;i++){let x=(i*173+61)%900,y=(i*241+95)%1300;ellipse(x,y,95,45,i%2?'#a19172':'#948369');}for(let i=0;i<55;i++){let x=(i*197+43)%900,y=(i*311+51)%1300;ellipse(x,y,5+i%4*3,3+i%3*2,i%2?'#b4a17f':'#756b5b');}for(let side of [0,1]){let x=side?870:30;for(let y=20;y<1300;y+=80){ellipse(x,y,75,49,'#6d6557');ellipse(x+(side?-19:19),y-15,48,23,'#96866b');ellipse(x,y-28,32,12,'#526b4c');}}for(let y of [210,1040]){ctx.fillStyle='#615d50';ctx.fillRect(270,y,170,14);for(let i=0;i<5;i++)line([[280+i*35,y-7],[280+i*35,y+21]],'#a28b67',5);}ctx.fillStyle='#d7c59b';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('BURNTWOOD QUARRY',450,77);}
function drawSankeys(){ctx.fillStyle='#a4a18b';ctx.fillRect(0,0,900,1300);ctx.fillStyle='#777f73';ctx.fillRect(340,0,220,1300);for(let y=70;y<1300;y+=100)line([[450,y],[450,y+42]],'#ded6b0',4);for(let i=0;i<6;i++){let y=120+i*195;for(let x of [130,620]){ctx.fillStyle=i%2?'#85715e':'#8a8973';ctx.fillRect(x,y,150,105);ctx.fillStyle=['#9e685f','#628d7c','#c2a66e'][i%3];ctx.fillRect(x-5,y+10,160,22);for(let k=0;k<5;k++){ctx.fillStyle=k%2?'#e3d8b0':'#fff0c7';ctx.fillRect(x+k*30,y+10,15,22);}ctx.fillStyle='#40554c';ctx.fillRect(x+12,y+45,120,38);ctx.fillStyle='#eee0bc';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(['CORNER SHOP','BAKERY','TAKEAWAY'][i%3],x+75,y+59);}}for(let y of [400,850])for(let x=360;x<550;x+=35){ctx.fillStyle='#e3ddbd';ctx.fillRect(x,y,20,65);}ctx.fillStyle='#eee0b8';ctx.font='bold 23px system-ui';ctx.textAlign='center';ctx.fillText('SANKEY’S CORNER',450,75);}
// Native Canvas design candidates only. Not registered in the game manifest.
// Same primitives, world units and camera scale as the production game.
function bossShade(x,y,r,inside,outside){let g=ctx.createRadialGradient(x,y,1,x,y,r);g.addColorStop(0,inside);g.addColorStop(1,outside);return g;}
function sharpEye(x,y,s,color='#efae60'){
 catShape(`M${x-s*6} ${y-3}L${x+s*6} ${y-6}L${x+s*4} ${y+2}L${x-s*4} ${y+3}Z`,'#1c2529',null);
 ellipse(x,y,3.4,2.2,color);ellipse(x+s*.6,y,1.1,2.1,'#281e29');ellipse(x-1,y-.7,.7,.7,'#fff0bd');
}
// Revision two: skinny Umbrella Man, comic Rubble Trouble, cursed husky Loki.
// Preview-only renderers; no production registration or gameplay mutation.
function proposalUmbrella(e){
 let wind=e.monsterState==='warning',strike=e.monsterState==='attack';ctx.save();ctx.scale(1.7,1.7);ctx.rotate(strike?-.13:wind?.06:-.06);
 // Thin legs and narrow slouch; oversized shirt hangs loose over the trousers.
 for(let s of [-1,1]){catShape(`M${s*2} 13L${s*7} 13L${s*10} 40L${s*4} 41Z`,'#434741','#293b32',.9);wildOval(s*8+3,42,7.5,3,'#2d3530','#727869');}
 catShape('M-8 -25Q-1 -34 7 -27L11 -5 10 17 4 14 1 20-5 16-12 19-12 -6Z',bossShade(-5,-16,43,'#ccc4a5','#999b82'),'#485344',1.2);
 // Open collar, crooked placket, frayed hem and obvious dirt patches.
 catShape('M-6 -27 0 -18 6 -28 3 -13-2 -11Z','#8e7d61','#6c6c55',.6);
 catShape('M-7 -28-1 -29-1 -19-5 -17Z','#dcd4b7','#7a8068',.5);catShape('M2 -28 7 -28 8 -19 3 -20Z','#dbd3b3','#7a8068',.5);
 line([[1,-13],[3,15]],'#7b806a',.8);for(let y of [-8,0,8])ellipse(4,y,.8,.8,'#ddd5b4');
 for(let [x,y,rx,ry]of [[-6,1,3,6],[7,11,3,3],[-7,-14,2,3],[0,15,3,1.8]])ellipse(x,y,rx,ry,'#82795188');
 line([[-9,-5],[-4,-2],[-7,4]],'#8b896b',.7);line([[5,-5],[9,-1],[6,3]],'#e1d7b655',.8);
 for(let [x,y]of [[-10,18],[-4,17],[2,18],[8,17]])line([[x,y],[x-1,y+3]],'#dbd3ad',.6);
 // Thin sleeves, small bony hands, no coat or broad chest.
 line([[-9,-20],[-18,-7],[-18,6]],'#9da38a',4.6);line([[-9,-20],[-16,-8]],'#d3caab',1.2);line([[-18,0],[-18,8]],'#b49d7b',3);wildOval(-18,9,2.6,4,'#ad9373','#dac09a');
 catShape('M-21 13-16 12-13 18Q-3 38-20 41Q-37 40-30 25L-23 19Z','#3b4140','#8f9987',.8);line([[-23,18],[-16,17]],'#beb38e',1.1);line([[-24,25],[-26,34]],'#71776b',.8);
 // Gaunt face with scruffy hair, long nose, unshaven jaw and a dirty cheek.
 wildOval(-1,-42,8.6,15,'#aa9272','#d4b996');catShape('M4 -44 14 -34 6 -31 2 -33Z','#bea07f','#655543',.7);
 catShape('M-9 -43-11 -50-6 -49-4 -59 1 -55 6 -57 10 -48 8 -41 2 -46-5 -40Z','#655b47','#3b4234',.7);
 line([[-6,-44],[3,-45]],'#4f4535',1.7);sharpEye(-1,-41,1,'#bca36d');line([[-4,-29],[5,-29]],'#6b5942',1);
 ellipse(-6,-35,2.2,3,'#82715166');for(let i=0;i<7;i++)line([[-7+i*1.5,-31+(i%2)*2],[-6.4+i*1.5,-28+(i%2)]],'#746246',.7);
 let ux=strike?31:33,uy=strike?-7:wind?-28:-18;
 line([[8,-22],[19,-15],[ux,uy]],'#a2a88d',4.5);line([[9,-23],[19,-17]],'#dad0ae',1);line([[21,-15],[ux,uy]],'#baa17d',2.7);wildOval(ux,uy,2.8,4,'#b19775','#e0c39a');
 ctx.save();ctx.translate(ux,uy);ctx.rotate(strike?.65:-.12);
 line([[0,14],[0,-49]],'#41493f',3);line([[-.6,13],[-.6,-48]],'#c8bd9d',.9);
 if(!strike){
  catShape('M-43 -31Q-20 -63 0 -64Q24 -63 43 -31L35 -27 23 -31 12 -25 0 -30-12 -25-24 -31-35 -27Z','#303d4b','#b6b6a0',1.1);
  for(let [d,c]of [['M-43 -31Q-25 -57 0 -64Q-18 -49-24 -31Z','#52616b'],['M-24 -31Q-15 -54 0 -64L0 -30-12 -25Z','#3f505b'],['M0 -64Q21 -50 23 -31L12 -25 0 -30Z','#53626c']])catShape(d,c,null);
  for(let x of [-43,-24,0,23,43])line([[0,-64],[x,-31]],'#b3bba077',.75);
  catShape('M-33 -41-24 -47-21 -39-29 -34Z','#8a8870','#bfb491',.6);line([[15,-48],[21,-44],[17,-38]],'#bec7ac',1);line([[0,-67],[0,-63]],'#c8c3ab',1.5);
 }else{catShape('M-7 -47 0 -70 8 -45 4 -8-4 -8Z','#41525f','#acb3a1',1.2);line([[0,-66],[0,-11]],'#b5bba3',1);}
 line([[0,14],[-2,20],[-7,20],[-9,16]],'#b9b69c',2.4);ctx.restore();ctx.restore();
}
function rubbleBoulder(x,y,w,h,base='#777c70',light='#babba3',tilt=0){
 ctx.save();ctx.translate(x,y);ctx.rotate(tilt);let g=ctx.createLinearGradient(-w*.4,-h*.4,w*.5,h*.5);g.addColorStop(0,light);g.addColorStop(.4,base);g.addColorStop(1,'#48564b');
 catShape(`M${-w*.47} ${-h*.18}Q${-w*.5} ${-h*.48} ${-w*.14} ${-h*.5}L${w*.25} ${-h*.45}Q${w*.55} ${-h*.3} ${w*.48} ${h*.13}L${w*.28} ${h*.45}Q${-w*.02} ${h*.6} ${-w*.37} ${h*.34}Z`,g,'#34463b',1.3);
 catShape(`M${-w*.44} ${-h*.2}Q${-w*.41} ${-h*.46} ${-w*.12} ${-h*.46}L${w*.25} ${-h*.4}L${w*.1} ${-h*.19}L${-w*.22} ${-h*.06}Z`,'#e5dec332',null);
 line([[-w*.28,-h*.1],[-w*.04,h*.05],[-w*.13,h*.29]],'#3e5144',.9);
 for(let i=0;i<7;i++)ellipse(-w*.28+(i*7%Math.max(1,w*.6)),-h*.2+(i*13%Math.max(1,h*.55)),.65,.7,'#dfd6b766');ctx.restore();
}
function proposalGolem(e){
 let wind=e.monsterState==='warning',strike=e.monsterState==='attack';ctx.save();ctx.scale(1.65,1.65);ctx.translate(0,strike?7:0);
 // A hunchbacked heap of jagged quarry stone, with the face in the main rock.
 // No separate little head, button nose, ears or leaf hair from the old design.
 let fy=wind?-27:strike?37:20;
 rubbleBoulder(-18,41,34,25,'#797a70','#b5b4a1',-.16);rubbleBoulder(24,42,38,27,'#6f756b','#b5b7a4',.17);
 catShape('M-32 -15-23 -35 4 -40 30 -25 38 5 26 32 4 40-24 32-37 13Z',bossShade(-15,-20,73,'#a5a390','#5a6158'),'#323f38',1.7);
 rubbleBoulder(-35,-25,43,41,'#777d71','#c3c1ab',-.36);rubbleBoulder(31,-9,36,39,'#727a70','#b6bba8',.3);
 catShape('M-45 -39-40 -58-27 -51-18 -66 1 -51 15 -48 13 -24-9 -18-33 -21Z','#747d70','#35463a',1.3);
 catShape('M-39 -40-38 -52-28 -46-18 -59-2 -47-8 -37Z','#b6b9a1',null);
 // Three broad slabs interlock at the belly instead of forming a smooth chest.
 for(let [x,y,w,h,a]of [[-14,18,32,25,-.13],[14,12,30,27,.16],[6,32,27,16,-.2]])rubbleBoulder(x,y,w,h,'#7e8373','#aeb39b',a);
 line([[-7,-12],[-1,-3],[-9,5],[-1,14],[3,29]],'#4c4a3c',5);line([[-7,-12],[-1,-3],[-9,5],[-1,14],[3,29]],'#c79a68',1.5);
 // One massive broken-stone fist, one smaller fist; sparse big facets read on a phone.
 rubbleBoulder(-48,fy,51,46,'#7c8174','#bdbfac',-.2);rubbleBoulder(47,23,36,40,'#777f73','#b2b9a5',.3);
 for(let [x,y,w]of [[-63,fy+15,15],[-49,fy+18,16],[-35,fy+14,13],[38,36,11],[50,37,12],[59,31,10]])rubbleBoulder(x,y,w,17,'#767e70','#bec1aa',-.1);
 // A sloping stone brow shelters uneven amber eyes and a crooked chipped grin.
 catShape('M-28 -35-13 -44 8 -40 23 -31 18 -13-3 -9-25 -17Z','#687466','#34483b',1.4);
 catShape('M-24 -29-11 -34-5 -28-10 -20-22 -21Z','#293f32',null);catShape('M2 -30 16 -31 18 -23 6 -20Z','#293f32',null);
 ellipse(-15,-26,3.7,3.4,'#dfb866');ellipse(10,-25,3.4,2.7,'#d6ac58');ellipse(-14,-26,1.2,2.6,'#253a2e');ellipse(11,-25,1,2.1,'#253a2e');
 catShape('M-30 -36-15 -48-1 -38-5 -30-17 -34-26 -28Z','#939e87','#3d5140',1);
 catShape('M0 -38 20 -40 27 -29 15 -26 4 -30Z','#a1a98f','#3d5140',1);
 catShape('M-22 -10-5 -14 19 -18 18 -5 4 2-14 0Z','#2e4234','#a0ac8f',1.2);
 catShape('M-18 -10-10 -11-11 -4-17 -4Z','#d4c9a1','#879274',.7);catShape('M7 -15 15 -17 13 -10 8 -9Z','#bdc397','#879274',.7);
 line([[-12,-19],[-8,-16],[-11,-13]],'#526a50',1.2);
 // Chips and fractures reinforce a quarry guardian, with humour in the wonky face.
 for(let [x,y]of [[-26,-49],[26,-13],[-49,fy-7],[13,21]]){line([[x-4,y-5],[x,y],[x-3,y+7]],'#455746',1);line([[x+1,y],[x+5,y+1]],'#c2c5ae',.7);}
 ctx.restore();
}
function proposalLoki(e){
 let wind=e.monsterState==='warning',strike=e.monsterState==='attack',freed=e.monsterState==='freed';
