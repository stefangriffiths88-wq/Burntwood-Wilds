erflow:hidden}#bossfill{height:100%;background:#e9974b;width:100%}#toast{position:absolute;top:110px;left:50%;transform:translateX(-50%);color:#fff4be;font-weight:900;text-shadow:0 2px 5px #000;pointer-events:none;text-align:center;font-size:16px}#controlshelp{font-size:10px;color:#e8f3dfb0;margin-top:3px}@media(orientation:portrait){#rotate{display:block}#panel{max-height:88dvh}#hud{opacity:.3}}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><span class="pill" id="catname">MIMI</span><span class="pill" id="wave">WAVE 1/10</span><span class="pill" id="level">LV 1</span><span class="pill" id="timer">0:00</span><span class="pill" id="multi">XP ×1.00</span><span class="pill" id="rerolls">↻ 1</span></div><div id="bars"><div class="bar"><div id="hp" class="fill health"></div></div><div class="bar"><div id="xp" class="fill xp"></div></div></div><div id="controlshelp">PLAYTEST V5 • Auto-attack + special moves • XP ×1–2</div></div><div id="bossbar"><div id="bossfill"></div></div><div id="toast"></div><div id="stick"><div id="nub"></div></div><button id="attackbtn" aria-label="Attack">⚔️<span>ATTACK</span></button><button id="spellbtn" aria-label="Cast special spell">✦<span>SPELL</span></button><div id="bottom"><button id="pause">Ⅱ Pause</button><button id="codex">✦ Mythics</button></div><div id="rotate">↻ Rotate your phone to landscape for the best experience.</div><div id="modal"><div id="panel"></div></div><script>
(()=>{'use strict';
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');let W=960,H=540,dpr=1,last=0,mode='menu',time=0,runTime=0,wave=1,waveTime=0,spawnClock=0,level=1,xp=0,xpNeed=22,rerolls=1,levelQueue=0,flawless=true,bonusChest=false,chestGiven=false,hitCount=0,toastTimer=0,toastText='',boss=null,runEnded=false;const D= id=>document.getElementById(id);const panel=D('panel'),modal=D('modal');let catIndex=0;let enemies=[],bullets=[],fx=[],pickups=[],decor=[],joystick={x:0,y:0,active:false,pointer:-1},keys={},weapons=[],spells=[],stats={};const cats=[{name:'Mimi',color:'#24252b',ear:'#d98baf',weapon:'Shadow Katana',spell:'Poison Claws',speed:230,hp:95},{name:'Tiny',color:'#e4e1c9',ear:'#d9a3a0',weapon:'Guardian Sword',spell:'Holy Nova',speed:180,hp:145},{name:'Merlin',color:'#777ca8',ear:'#c0a3e6',weapon:'Arcane Staff',spell:'Magic Missiles',speed:194,hp:105},{name:'Willow',color:'#d6a16c',ear:'#f1b7a2',weapon:'Wildwood Bow',spell:'Thorn Volley',speed:215,hp:100},{name:'Bramble',color:'#996b51',ear:'#e3a69e',weapon:'Berserker Axe',spell:'Ground Slam',speed:184,hp:135}];const weaponTypes=[['Shadow Katana','melee',52,0.55,75,'#d1c6ff'],['Guardian Sword','melee',58,0.86,92,'#ffedaa'],['Arcane Staff','shot',26,0.62,270,'#a8b6ff'],['Wildwood Bow','shot',33,0.78,345,'#e8c07a'],['Berserker Axe','melee',88,1.32,108,'#ffb577'],['Twin Daggers','melee',26,0.28,68,'#f5e2df'],['Hunting Spear','shot',38,0.85,315,'#c9e2bf'],['Warhammer','area',90,1.75,108,'#ffbc6e'],['Returning Chakram','shot',26,0.57,255,'#93e9ed'],['Spell Wand','shot',18,0.34,255,'#d2a3ff']];const spellNames=['Poison Claws','Shadow Dash','Venom Cloud','Blade Cyclone','Phantom Copies','Holy Nova','Shield Bash','Divine Barrier','Judgment Hammer','Sacred Ground','Ice Orb','Magic Missiles','Lava Trail','Chain Lightning','Meteor Storm','Thorn Volley','Entangling Roots','Explosive Arrow','Spirit Wolves','Poison Rain','Ground Slam','Berserker Rage','Earthquake','Blood Frenzy','Whirlwind'];const mythics=[['Twin Daggers','Poison Claws','Venom Blades'],['Warhammer','Chain Lightning','Thunder Hammer'],['Arcane Staff','Meteor Storm','Inferno Staff'],['Shadow Katana','Phantom Copies','Phantom Katana'],['Hunting Spear','Ice Orb','Frozen Spear'],['Returning Chakram','Chain Lightning','Storm Chakram'],['Guardian Sword','Holy Nova','Divine Guardian'],['Wildwood Bow','Explosive Arrow','Wildfire Bow'],['Berserker Axe','Blood Frenzy','Bloodstorm Axe'],['Spell Wand','Magic Missiles','Arcane Barrage']];let known=[];try{known=JSON.parse(localStorage.getItem('bw_mythics')||'[]')}catch(e){};let player={x:480,y:270,hp:100,maxHp:100,speed:200,inv:0};let rng=Math.random;const rand=(a,b)=>a+rng()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cvs.width=Math.floor(W*dpr);cvs.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();function show(html){modal.style.display='flex';panel.innerHTML=html}function hide(){modal.style.display='none'}function btn(txt,fn){let b=document.createElement('button');b.className='choice';b.innerHTML=txt;b.onclick=fn;return b}function toast(s){toastText=s;toastTimer=2.5}function menu(){mode='menu';D('hud').style.display='none';D('stick').style.display='none';D('bottom').style.display='none';D('attackbtn').style.display='none';D('spellbtn').style.display='none';D('bossbar').style.display='none';show('<div class="sub">BURNTWOODS WILDS • PLAYTEST V5</div><h1>🏉 RUGBY CLUB RUMBLE</h1><p>Survive 10 waves on a cartoon Burntwood rugby pitch. Auto-attacking cats, XP multipliers, upgrades, one reroll, bonus chests and <b>Bruce the Deer</b> as the final boss!</p><h2>Choose your cat</h2><p>🐈‍⬛ Mimi sometimes wanders in with her fluffy pink ball when bored. Win the arena to see her meerkat victory pose!</p><div class="choices" id="catchoices"></div><p class="tiny">Landscape mode recommended. Left thumb to move. Keyboard WASD / arrows also work. This is a gameplay prototype, not the final artwork or balancing.</p>');const cc=D('catchoices');cats.forEach((c,i)=>cc.appendChild(btn('<strong>'+c.name+'</strong><small>'+c.weapon+'<br>'+c.spell+'</small>',()=>start(i))))}
function start(i){catIndex=i;const c=cats[i];player={x:W/2,y:H/2,hp:c.hp,maxHp:c.hp,speed:c.speed,inv:0,face:0,regen:0};stats={damage:0,attackSpeed:0,regen:0,armour:0};weapons=[{name:c.weapon,lvl:1,clock:0}];spells=[{name:c.spell,lvl:1,clock:0}];enemies=[];bullets=[];fx=[];pickups=[];wave=1;waveTime=0;spawnClock=0;runTime=0;level=1;xp=0;xpNeed=22;rerolls=1;levelQueue=0;flawless=true;bonusChest=false;chestGiven=false;hitCount=0;killStreak=0;manualClock=0;spellClock=0;slashAnim=0;victoryClock=0;boss=null;runEnded=false;mode='play';hide();D('hud').style.display='block';D('stick').style.display='block';D('bottom').style.display='flex';D('attackbtn').style.display='block';D('spellbtn').style.display='block';D('catname').textContent=c.name.toUpperCase();toast('WAVE 1 — SURVIVE!')}
const colors={Common:'#c4cbd0',Uncommon:'#6bdd96',Rare:'#67a7ff',Epic:'#cb86ff',Legendary:'#ffc65e'};function rarity(){let r=Math.random(),boost=(wave-1)*.038;return r<Math.max(.09,.67-boost*1.7)?'Common':r<Math.max(.28,.89-boost)?'Uncommon':r<.965-boost*.24?'Rare':r<.995-boost*.10?'Epic':'Legendary'}const value={Common:2,Uncommon:3,Rare:4,Epic:6,Legendary:9};function availableMythics(){return mythics.filter(([w,s,n])=>weapons.some(x=>x.name===w&&x.lvl>=5)&&spells.some(x=>x.name===s&&x.lvl>=5)&&!weapons.some(x=>x.mythic===n))}function addXp(amount){xp+=amount;while(xp>=xpNeed){xp-=xpNeed;level++;xpNeed=Math.floor(22+level*9+level*level*.85);levelQueue++}if(levelQueue&&mode==='play')upgradeMenu()}
function choices(){const arr=[];let wm=weapons.filter(w=>w.lvl<5),sm=spells.filter(s=>s.lvl<5);const allW=weaponTypes.map(x=>x[0]).filter(n=>!weapons.some(w=>w.name===n));const allS=spellNames.filter(n=>!spells.some(s=>s.name===n));for(let i=0;i<3;i++){let r=Math.random(),rar=rarity(),v=value[rar],choice;if(r<.34&&wm.length){let w=wm[Math.floor(Math.random()*wm.length)];choice={title:w.name+' +1',detail:'Weapon tier '+(w.lvl+1)+'/5',rar,action:()=>w.lvl++}}else if(r<.55&&sm.length){let s=sm[Math.floor(Math.random()*sm.length)];choice={title:s.name+' +1',detail:'Spell tier '+(s.lvl+1)+'/5',rar,action:()=>s.lvl++}}else if(r<.71&&weapons.length<4&&allW.length){let name=allW[Math.floor(Math.random()*allW.length)];choice={title:'New: '+name,detail:'Equip another auto-attack',rar,action:()=>weapons.push({name,lvl:1,clock:0})}}else if(r<.81&&spells.length<3&&allS.length){let name=allS[Math.floor(Math.random()*allS.length)];choice={title:'New: '+name,detail:'Unlock a new spell',rar,action:()=>spells.push({name,lvl:1,clock:0})}}else{let key=['damage','attackSpeed','armour','regen','maxHp'][Math.floor(Math.random()*5)];let names={damage:'Attack +',attackSpeed:'Attack speed +',armour:'Armour +',regen:'Regeneration +',maxHp:'Maximum HP +'};choice={title:names[key]+(key==='maxHp'?v*4:key==='attackSpeed'?v*2+'%':v),detail:'Permanent for this run',rar,action:()=>{if(key==='maxHp'){player.maxHp+=v*4;player.hp+=v*4}else if(key==='attackSpeed')stats.attackSpeed+=v*.02;else if(key==='regen')stats.regen+=v*.055;else stats[key]+=v}}}arr.push(choice)}return arr}
function upgradeMenu(){if(!levelQueue||mode==='dead'||mode==='win')return;mode='upgrade';const opts=choices();const myth=availableMythics();show('<div class="sub">LEVEL '+level+' • WAVE '+wave+'</div><h2>Choose your upgrade</h2><p>Choose one reward or heal instead. Rerolls remaining: '+rerolls+'</p><div class="choices" id="upgrades"></div><div id="extra"></div>');let holder=D('upgrades');opts.forEach(o=>{let b=btn('<strong style="color:'+colors[o.rar]+'">'+o.title+'</strong><small>'+o.rar+' • '+o.detail+'</small>',()=>{o.action();nextUpgrade()});holder.appendChild(b)});let heal=btn('<strong>❤ Heal 30%</strong><small>Skip an upgrade to recover health</small>',()=>{player.hp=Math.min(player.maxHp,player.hp+player.maxHp*.3);nextUpgrade()});holder.appendChild(heal);if(myth.length){let m=myth[0],b=btn('<strong style="color:#f8aaff">??? ✦ MYTHIC MERGE</strong><small>Maxed weapon and spell resonate!</small>',()=>{weapons.find(w=>w.name===m[0]).mythic=m[2];if(!known.includes(m[2])){known.push(m[2]);try{localStorage.setItem('bw_mythics',JSON.stringify(known))}catch(e){}}toast('MYTHIC DISCOVERED: '+m[2]);nextUpgrade()});holder.prepend(b)}if(rerolls>0){let b=document.createElement('button');b.className='mainbtn';b.textContent='↻ REROLL (1 available per arena)';b.onclick=()=>{rerolls--;upgradeMenu()};D('extra').appendChild(b)}}function nextUpgrade(){levelQueue--;hide();mode='play';if(levelQueue)upgradeMenu()}
function chestMenu(extra=false){mode='chest';let grade=wave>=10?'Legendary':wave>=8?'Epic':wave>=5?'Rare':wave>=3?'Uncommon':'Common';if(extra)grade=wave>=7?'Epic':wave>=4?'Rare':'Uncommon';let v=value[grade];show('<div class="sub">'+(extra?'FLAWLESS BONUS':'BOSS REWARD')+'</div><h2 style="color:'+colors[grade]+'">🎁 '+grade+' Chest!</h2><p>Choose one powerful reward. Boss and bonus chests are graded by wave.</p><div class="choices" id="chestchoices"></div>');let options=[{title:'Weapon power +'+v,desc:'All equipped weapons hit harder',fn:()=>stats.damage+=v*1.5},{title:'Maximum health +'+v*5,desc:'Increase maximum HP and heal',fn:()=>{player.maxHp+=v*5;player.hp=Math.min(player.maxHp,player.hp+v*8)}},{title:'Attack speed +'+v*3+'%',desc:'More frequent attacks',fn:()=>stats.attackSpeed+=v*.03}];let upgradeable=weapons.filter(w=>w.lvl<5);if(upgradeable.length){let w=upgradeable[Math.floor(Math.random()*upgradeable.length)];options[2]={title:w.name+' +1',desc:'Advance weapon to tier '+(w.lvl+1),fn:()=>w.lvl++}}options.forEach(o=>D('chestchoices').appendChild(btn('<strong style="color:'+colors[grade]+'">'+o.title+'</strong><small>'+o.desc+'</small>',()=>{o.fn();hide();mode='play';if(wave===10&&runEnded&&!boss){win();return}if(levelQueue)upgradeMenu()})))}
function waveEnd(){if(wave===5&&!chestGiven){chestGiven=true;chestMenu(false);toast('WAVE 5 CHALLENGE CLEARED!')}if(flawless&&!bonusChest){bonusChest=true;chestMenu(true);toast('FLAWLESS! BONUS CHEST!')}if(wave>=10){win();return}wave++;waveTime=0;spawnClock=0;hitTimer=0;flawless=true;enemies=enemies.filter(e=>e.boss);toast('WAVE '+wave+' — MORE ENEMIES!')}
function win(){mode='victory';victoryClock=0;D('bossbar').style.display='none';D('attackbtn').style.display='none';D('spellbtn').style.display='none';D('stick').style.display='none';show('<h1>🏆 RUGBY CLUB CLEARED!</h1><h2>Bruce the Deer defeated!</h2><p>'+cats[catIndex].name+' survived all ten waves and reached level '+level+'. Hits taken: '+hitCount+'.</p><p>Permanent roguelike upgrades will be added in a later version.</p><button class="mainbtn" id="again">Play again</button>');D('again').onclick=menu}function dead(){mode='dead';D('bossbar').style.display='none';show('<h1>GAME OVER</h1><p>You reached <b>Wave '+wave+'</b> and <b>Level '+level+'</b>. Try a different cat or focus on keeping the XP multiplier high.</p><button class="mainbtn" id="again">Try again</button>');D('again').onclick=()=>start(catIndex)}
function spawnEnemy(){let side=Math.floor(rand(0,4)),x=side===0?-35:side===1?W+35:rand(0,W),y=side===2?-35:side===3?H+35:rand(0,H);let t=Math.random(),type=t<.12+wave*.01?'runner':t<.21+wave*.014?'brute':t<.29+wave*.018?'spitter':'feral';let hp=type==='brute'?70+wave*18:type==='runner'?24+wave*6:35+wave*8;enemies.push({x,y,type,hp,maxHp:hp,r:type==='brute'?18:type==='runner'?11:14,speed:type==='runner'?105+wave*5:type==='brute'?39+wave*3:61+wave*4,attack:rand(.2,1.1),color:type==='runner'?'#e2a36a':type==='brute'?'#84607c':type==='spitter'?'#85ad7e':'#aa8271',boss:false})}function spawnBruce(){let hp=1650;boss={x:W*.76,y:H*.5,type:'bruce',hp,maxHp:hp,r:54,speed:88,attack:1.6,phase:0,boss:true,charge:0,dir:0};enemies.push(boss);D('bossbar').style.display='block';toast('🦌 BRUCE THE DEER!');}function damageEnemy(e,damage){if(e.hp<=0)return;e.hp-=damage;if(e.hp<=0){killStreak=Math.min(20,killStreak+1);if(e.boss){boss=null;D('bossbar').style.display='none';toast('BRUCE DEFEATED!');runEnded=true;chestMenu(false);return}let mult=1+Math.min(1,killStreak/20);pickups.push({x:e.x,y:e.y,v:e.type==='brute'?12:e.type==='runner'?6:8,mult});fx.push({x:e.x,y:e.y,t:.22,r:e.r+5,color:'#f7db95'});enemies.splice(enemies.indexOf(e),1)}}function nearest(){let best=null,d=Infinity;for(const e of enemies){let dd=(e.x-player.x)**2+(e.y-player.y)**2;if(dd<d){d=dd;best=e}}return best}function projectile(x,y,tx,ty,damage,speed,color,size=5,pierce=0,enemy=false){let a=Math.atan2(ty-y,tx-x);bullets.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,damage,speed,color,size,pierce,enemy,life:3,hit:new Set()})}function attacks(dt){for(const w of weapons){let data=weaponTypes.find(x=>x[0]===w.name);if(!data)continue;w.clock-=dt;if(w.clock>0)continue;let target=nearest();if(!target)continue;let [name,kind,dmg,cool,range,color]=data;let lv=w.lvl||1;w.clock=cool/(1+stats.attackSpeed+lv*.075);let a=Math.atan2(target.y-player.y,target.x-player.x),damage=dmg*(1+(lv-1)*.28)+stats.damage;if(w.mythic)damage*
