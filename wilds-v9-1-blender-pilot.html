function updateJosephContact(dt,dx,dy){if(selected!==11)return;if(!(player.zoomCooldowns instanceof Map))player.zoomCooldowns=new Map();for(const [e,t] of player.zoomCooldowns){if(t<=dt||!enemies.includes(e))player.zoomCooldowns.delete(e);else player.zoomCooldowns.set(e,t-dt);}if(player.overhype||Math.hypot(dx,dy)<.18)return;const speed=(195+speedLevel*29)*hero().spd*(1+statsBuild.agility*.1),ox=player.x-dx*speed*dt,oy=player.y-dy*speed*dt;addZoomTrail(ox,oy);const a=Math.atan2(dy,dx),ux=Math.cos(a),uy=Math.sin(a);for(const e of [...enemies]){if(e.charmed>0||e.spawnGrace>0||player.zoomCooldowns.has(e))continue;const sx=player.x-ox,sy=player.y-oy,den=sx*sx+sy*sy||1,t=Math.max(0,Math.min(1,((e.x-ox)*sx+(e.y-oy)*sy)/den));if(Math.hypot(e.x-ox-sx*t,e.y-oy-sy*t)>e.r+20)continue;player.zoomCooldowns.set(e,Math.max(.22,.48/(1+weaponMods.swift*.12)));hitEnemy(e,(25+slashLevel*8)*(1+weaponBoost*.16),ux,uy);if(mode!=='play')return;player.inv=Math.max(player.inv,.25);if(enemies.includes(e)&&!e.boss){const force=evolution.rank>=2?310:180;e.vx+=ux*force/(e.mass||1);e.vy+=uy*force/(e.mass||1);}}}
function drawJosephTrails(){if(selected!==11)return;ctx.save();ctx.lineCap='round';for(const p of player.zoomTrail||[]){ctx.globalAlpha=p.t/p.max*.5;ctx.strokeStyle=player.overhype?'#ffe68c':'#a9f3d9';ctx.lineWidth=player.overhype?9:4;ctx.beginPath();ctx.moveTo(p.x,p.y-12);ctx.lineTo(p.ex,p.ey-12);ctx.stroke();}if(player.overhype){ctx.globalAlpha=1;ctx.fillStyle='#fff0a9';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('OVERHYPE '+player.overhype.remaining,player.x,player.y-142);}ctx.restore();}

function walkingTreeModel(m,state,pose){const phase=pose*6.283/6,walk=state==='walk'?Math.sin(phase):0;for(const side of [-1,1]){meshRod(m,[side*8,0,23],[side*11,walk*side*6,6],4,'#725237');for(let k=-1;k<=1;k++)meshRod(m,[side*11,walk*side*6,6],[side*(15+k*4),9+walk*side*6+k*4,2],2,'#725237');}meshBall(m,0,0,40,13,11,30,'#8f6946');for(const side of [-1,1]){meshRod(m,[side*10,0,50],[side*28,walk*side*5,39],4,'#795738');meshRod(m,[side*28,walk*side*5,39],[side*43,7+walk*side*6,25],3,'#795738');for(let k=0;k<3;k++)meshRod(m,[side*43,7+walk*side*6,25],[side*(45+k*4),10+k*2+walk*side*6,22+k*3],1.5,'#9bac67');}meshEyes(m,58,10,6,'#e5ce72');meshRod(m,[-5,12,48],[5,12,46],1.4,'#433b2c');for(let k=0;k<7;k++){const a=k*2.399;meshBall(m,Math.cos(a)*16,Math.sin(a)*10,77+(k%3)*4,11,9,12,k%2?'#6b9b56':'#498255');}meshRod(m,[1,2,79],[6,0,98],1.7,'#795738');meshBall(m,7,0,94,7,3,4,'#87b95f');}

// Match-night rules: modest rewards, readable encounters and local personal bests.
function mobCap(){return activeStyle==='family'?36:44;}
function incomingDamage(base){return Math.max(2,(base-armor*1.5)*(activeStyle==='family'?.70:1));}
function trySecondWind(){if(activeStyle!=='family'||reviveUsed||mode!=='play')return false;reviveUsed=true;totalRevives++;player.overhype=null;player.hp=Math.max(30,player.maxHp*.65);player.inv=3;powerCd=0;dashCd=0;shots=[];dangerZones=dangerZones.filter(z=>Math.hypot(z.x-player.x,z.y-player.y)>210);enemies=enemies.filter(e=>e.boss||e.elite||dist(e,player)>155);if(boss){bossTell=null;boss.recover=2;bossAttackClock=2;}announceMatch('SECOND WIND!','You have another chance — use your special!', '#b6f3c7',3);spawnImpact(player.x,player.y,18,'#b6f3c7');playTone('level');return true;}
function dropExperience(x,y,value){if(xpGems.length>=140){const nearest=xpGems.reduce((a,b)=>Math.hypot(b.x-x,b.y-y)<Math.hypot(a.x-x,a.y-y)?b:a,xpGems[0]);nearest.v+=value;return;}xpGems.push({x:x+rand(-7,7),y:y+rand(-7,7),v:value});}
function updateExperience(dt){for(let i=xpGems.length-1;i>=0;i--){const g=xpGems[i],d=Math.hypot(g.x-player.x,g.y-player.y);if(d<115){const move=Math.min(d,(150+(115-d)*5)*dt);g.x+=(player.x-g.x)/Math.max(1,d)*move;g.y+=(player.y-g.y)/Math.max(1,d)*move;}if(d<22){gainXp(g.v);xpGems.splice(i,1);}}if(matchNotice)matchNotice.t-=dt;}
function drawExperience(){ctx.save();for(const g of xpGems){if(Math.abs(g.x-player.x)>W/(2*ZOOM)+25||Math.abs(g.y-player.y)>H/(2*ZOOM*TILT)+25)continue;const r=g.v>=8?6:4;ctx.fillStyle=g.v>=8?'#dcd2ff':'#90dfff';ctx.beginPath();ctx.moveTo(g.x,g.y-r*1.6);ctx.lineTo(g.x+r,g.y);ctx.lineTo(g.x,g.y+r);ctx.lineTo(g.x-r,g.y);ctx.closePath();ctx.fill();ctx.fillStyle='#f1fbff';ctx.fillRect(g.x-1,g.y-r,2,3);}ctx.restore();}
function offerGrowth(){if(mode!=='play'||xp<xpNeed||growthTime()<nextGrowthAt||bossWarning>0)return false;xp-=xpNeed;level++;xpNeed=Math.round(32+level*15+level*level*.8);upgrades=1;growthShown++;nextGrowthAt=growthTime()+20;player.hp=Math.min(player.maxHp,player.hp+5);playTone('level');spawnImpact(player.x,player.y,9,'#b8e8fa');showUpgrade();return true;}
function canEvolve(){return evolution.rank===0?growthTime()>=25&&level>=2:evolution.rank===1?growthTime()>=60&&level>=3:evolution.rank===2?growthTime()>=100&&level>=4&&(gameType!=='rugby'||captainDefeated):false;}
function weaponChoice(){const r=evolution.rank;if(canEvolve())return evolutionUpgrade();const speed=Math.random()<.4;return speed?['QUICK PAWS',selected===11?'Bump opponents more often.':'Attack a little faster.',()=>{weaponMods.swift++;}]:['STRONGER '+(selected===9?'PASSES':selected===10?'STARS':selected===11?'BUMPS':'STRIKES'),'Improve your normal attack.',()=>{slashLevel++;}];}
function specialChoice(){if(selected===11)return ['MORE OVERHYPE','One extra bounce and stronger impacts. Next: '+Math.min(14,overhypeHits()+1)+' hits.',()=>{powerLevel++;}];return ['SUPER '+(['SHADOW','STOMP','METEOR','VOLLEY','RAGE','BRANCHES','FART / LAUGH','FURY','CATS','TACKLE','GLITTER','OVERHYPE'][selected]),'Make your special stronger.',()=>{powerLevel++;}];}
function survivalChoice(){if(player.hp<player.maxHp*.55)return ['MORE HEARTS','Heal 25 and gain 15 maximum HP.',()=>{player.maxHp+=15;player.hp=Math.min(player.maxHp,player.hp+25);}];return Math.random()<.5?['PADDED KIT','Take less damage from hits.',()=>{armor+=2;statsBuild.defence++;}]:['SECOND HELPING','Slowly recover health during the match.',()=>{regenLevel+=.55;statsBuild.regen++;}];}
function drawMatchChoices(holder,choices,onPick){holder.innerHTML='';for(let i=0;i<choices.length;i++){const [name,desc,apply]=choices[i],b=document.createElement('button');b.style.cssText='display:block;width:100%;padding:14px 12px;margin:9px 0;border:2px solid '+(name.includes('EVOLVE')?'#ffdf94':'#b7d9d8')+';background:'+(['#d4e9ec','#ead9f0','#dbeacb'][i])+';text-align:left;font-size:16px;line-height:1.3';b.innerHTML='<b>'+(['✦ ','★ ','♥ '][i])+name+'</b><div style="font-size:12px;font-weight:500;margin-top:5px">'+desc+'</div>';b.onclick=()=>{apply();onPick();};holder.appendChild(b);}}
function renderPacedOptions(){drawMatchChoices($('options'),[weaponChoice(),specialChoice(),survivalChoice()],()=>{upgrades=0;mode='play';$('overlay').style.display='none';hud();saveRun();});}
function openEarnedChest(){mode='chest';$('overlay').style.display='flex';$('panel').innerHTML='<h1>WELL-EARNED KIT BAG</h1><p>Dangerous opponent defeated. Choose one reward.</p><div id="earnedChoices"></div>';const first=canEvolve()?evolutionUpgrade():['FIREWORK ATTACKS','Your normal attacks burn enemies.',()=>weaponMods.flame++];drawMatchChoices($('earnedChoices'),[first,['SPECIAL PRACTICE','Shorten your special cooldown.',()=>{statsBuild.focus++;}],['ORANGE SLICES','Heal 35 HP and gain 10 maximum HP.',()=>{player.maxHp+=10;player.hp=Math.min(player.maxHp,player.hp+35);}]],()=>{mode='play';$('overlay').style.display='none';hud();saveRun();});}
function onEliteDefeated(e){coins+=6;dropExperience(e.x,e.y,8);eliteWins++;if(e.captain){captainDefeated=true;announceMatch('CAPTAIN DOWN!','Final evolution is now available.', '#ffe19d',2.6);}else announceMatch('GREAT TACKLE!','Pick up your reward.', '#ffe19d',2);if(chestDrops<2){chestDrops++;chests.push({x:e.x,y:e.y,life:999,earned:true});}effects.push({x:e.x,y:e.y,t:.5,ring:45,color:'#ffe19d'});}


function announceMatch(title,sub,color='#fff0b9',t=2){matchNotice={title,sub,color,t,max:t};}
function drawMatchNotice(){if(!matchNotice||matchNotice.t<=0)return;ctx.save();ctx.globalAlpha=Math.min(1,matchNotice.t*2);ctx.textAlign='center';ctx.fillStyle='#173744dc';ctx.beginPath();ctx.roundRect(18,H*.24,W-36,62,10);ctx.fill();ctx.fillStyle=matchNotice.color;ctx.font='bold 17px system-ui';ctx.fillText(matchNotice.title,W/2,H*.24+25);ctx.fillStyle='#eaf0e9';ctx.font='11px system-ui';ctx.fillText(matchNotice.sub,W/2,H*.24+45);ctx.restore();}
function recordBook(){try{return JSON.parse(localStorage.getItem('burntwood-wilds-records'))||{};}catch{return {};}}
function recordResult(win){const book=recordBook(),key=hero().name+'-'+activeStyle+'-'+gameType,old=book[key]||(gameType==='rugby'&&book[hero().name+'-'+activeStyle]?{...book[hero().name+'-'+activeStyle]}:null)||{plays:0,wins:0,bestKills:0,bestTime:0,bestStars:0};old.plays++;if(win)old.wins++;old.bestKills=Math.max(old.bestKills,kills);old.bestTime=Math.max(old.bestTime,Math.round(elapsed));const stars=win?(totalRevives===0&&eliteWins>=2?3:2):elapsed>=60?1:0;old.bestStars=Math.max(old.bestStars,stars);book[key]=old;try{localStorage.setItem('burntwood-wilds-records',JSON.stringify(book));}catch{}return {old,stars};}
function showMatchResult(win){if(!win&&trySecondWind())return;const {old,stars}=recordResult(win);clearSavedRun();player.rugbyCharge=null;player.overhype=null;glitterRain=null;mode='end';for(const id of ['stick','power','dash','ultimate','pauseBtn','mapBtn'])$(id).style.display='none';$('overlay').style.display='flex';$('panel').innerHTML='<h1>'+hero().name.toUpperCase()+(win?(gameType==='rugby'?' BEAT BRUCE!':' CLEARED BURNTWOOD!'):' • GREAT EFFORT!')+'</h1><div style="font-size:37px;letter-spacing:7px;color:#ffd877">'+Array.from({length:3},(_,i)=>i<stars?'★':'☆').join('')+'</div><p>'+kills+' opponents defeated • '+Math.round(elapsed)+' seconds<br>'+eliteWins+' dangerous opponents beaten</p><p style="font-size:12px;color:#d4e4df">'+activeStyle.toUpperCase()+' • PERSONAL BEST '+old.bestKills+' KILLS<br>'+old.wins+' WINS AS '+hero().name.toUpperCase()+'</p><button id="again" style="width:100%">PLAY AGAIN</button><button id="chooseCat" style="width:100%;font-size:15px;margin-top:10px">CHOOSE ANOTHER CAT</button>';$('again').onclick=()=>{unlockSound();reset();};$('chooseCat').onclick=returnToRoster;playTone(win?'level':'magic');}
function renderMatchOptions(){const f=$('familyMatch'),c=$('challengeMatch');if(f&&c){f.className=matchStyle==='family'?'selectedMode':'';c.className=matchStyle==='challenge'?'selectedMode':'';f.onclick=()=>{matchStyle='family';renderMatchOptions();renderSelect();};c.onclick=()=>{matchStyle='challenge';renderMatchOptions();renderSelect();};}const book=recordBook(),b=book[hero().name+'-'+matchStyle+'-'+modeChoice]||(modeChoice==='rugby'?book[hero().name+'-'+matchStyle]:null);const record=$('heroRecord');if(record)record.textContent=b?'PERSONAL BEST '+b.bestKills+' KILLS • '+b.wins+' WINS':'YOUR FIRST '+matchStyle.toUpperCase()+' MATCH';}

const stick=$('stick'),nub=$('nub');function move(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y)||1,k=Math.min(1,l/48);joy.x=x/l*k;joy.y=y/l*k;nub.style.transform='translate('+joy.x*36+'px,'+joy.y*36+'px)'}function release(e){if(e&&joy.id!==e.pointerId)return;joy.down=false;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerdown',e=>{e.preventDefault();joy.down=true;joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',e=>{if(joy.down&&joy.id===e.pointerId)move(e)});stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
