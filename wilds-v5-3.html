function startWeaponSwing(mult=1,wide=false){

function updateWeaponSwing(dt){
 const w=weaponSwing;if(!w)return;
 const old=w.t;w.t+=dt;const progress=Math.min(1,w.t/w.duration);
 const sweep=w.wide?2.6:2.2,angle=w.face-sweep/2+sweep*progress;
 const prev=w.face-sweep/2+sweep*Math.min(1,old/w.duration);
 for(const e of [...enemies]){
  if(w.hit.has(e))continue;
  // Actual moving blade segment: enemy circle intersects the swept tip-to-hilt weapon.
  const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy);
  if(d>w.reach+e.r+12||d<9)continue;
  const targetAngle=Math.atan2(dy,dx);
  const diff=Math.atan2(Math.sin(targetAngle-prev),Math.cos(targetAngle-prev));
  const travelled=Math.atan2(Math.sin(angle-prev),Math.cos(angle-prev));
  const within=diff>=-.13&&diff<=travelled+.13;
  if(!within)continue;
  const ux=Math.cos(targetAngle),uy=Math.sin(targetAngle);

 // Spatial buckets avoid comparing every enemy to every other enemy.

 for(const e of enemies){e.x=Math.max(e.r+17,Math.min(worldW()-e.r-17,e.x+(e.vx||0)*dt));e.y=Math.max(e.r+42,Math.min(worldH()-e.r-20,e.y+(e.vy||0)*dt));e.vx=(e.vx||0)*decay;e.vy=(e.vy||0)*decay;
  const k=Math.floor(e.x/cell)+','+Math.floor(e.y/cell);if(!buckets.has(k))buckets.set(k,[]);buckets.get(k).push(e);
 }
 for(const e of enemies){

  for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
   for(const o of buckets.get((cx+ox)+','+(cy+oy))||[]){

   }
  }
  const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy)||.001,minimum=e.r+13;
  if(d<minimum){const nx=dx/d,ny=dy/d,overlap=minimum-d;
   e.x+=nx*overlap*.68;e.y+=ny*overlap*.68;
   player.x-=nx*overlap*.32;player.y-=ny*overlap*.32;
   player.vx-=nx*(e.boss?90:e.brute?54:26);player.vy-=ny*(e.boss?90:e.brute?54:26);
  }
 }
 player.x=Math.max(24,Math.min(worldW()-24,player.x));player.y=Math.max(40,Math.min(worldH()-24,player.y));
 for(let i=impactParticles.length-1;i>=0;i--){const p=impactParticles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=decay;p.vy*=decay;if(p.life<=0)impactParticles.splice(i,1)}
